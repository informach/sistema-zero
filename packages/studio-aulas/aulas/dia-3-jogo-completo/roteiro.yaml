meta:
  slug: dia-3-jogo-completo
  titulo: "Dia 3 — Um jogo de verdade"
  dia: 3
  # Começa do jogo REAL do Dia 2 (imagem 1) e termina no jogo completo (imagem 2):
  # vidas, telas início/jogando/ganhou/perdeu, ganhar e perder.
  projetoInicial: "inicial.szproject.json"
  extensoes: [game-2d]
  cenarioAbertura: cenario-a
  cenarioMeio: cenario-b
  voz:
    estabilidade: 0.4
    estilo: 0.6

cenas:
  - id: c1-oi
    tipo: apresentacao
    emocao: empolgado
    narracao: >-
      Oi! Bem-vindo ao Dia 3, o nosso último dia juntos. Seu jogo já tem nave, tiro,
      asteroide e placar. Hoje a gente transforma ele num jogo de verdade: com vidas,
      um jeito de ganhar e um de perder, e as telas de começo, vitória e derrota.
      Vamos com calma, por partes. Bora?

  - id: c2-var-vs-const
    tipo: teoria
    emocao: curioso
    narracao: >-
      Duas caixinhas novas, de tipos diferentes. Uma guarda as vidas, um número que
      MUDA no jogo: cada batida tira uma vida, então é uma variável. A outra guarda
      o objetivo, vinte e seis asteroides, um número que NÃO muda: é uma constante.
    ilustracao:
      nome: variavel
      params: { nome: vidas }

  - id: c3-vidas-e-alvo
    tipo: pratica
    emocao: neutro
    narracao: >-
      Na categoria Programação, Variáveis, pega Criar variável, escreve vidas e põe o
      valor 3. Depois Criar constante, escreve alvo e põe 26.
    acoes:
      - tipo: abrirCategoria
        categoria: "Programação"
      - tipo: pegarBloco
        bloco: sz_js_var_create
        encaixarEm: sz_frame_behavior
        ref: varVidas
      - tipo: configurarCampo
        campo: NAME
        valor: vidas
        bloco: "@varVidas"
      - tipo: preencherSoquete
        bloco: sz_val_number
        emBloco: "@varVidas"
        input: VALUE
        campo: NUM
        valor: 3
      - tipo: balao
        ancora: { bloco: "@varVidas", campo: NAME }
        texto: "vidas = 3 (variável)"
      - tipo: pegarBloco
        bloco: sz_js_const_create
        encaixarEm: sz_frame_behavior
        ref: constAlvo
      - tipo: configurarCampo
        campo: NAME
        valor: alvo
        bloco: "@constAlvo"
      - tipo: preencherSoquete
        bloco: sz_val_number
        emBloco: "@constAlvo"
        input: VALUE
        campo: NUM
        valor: 26
      - tipo: balao
        ancora: { bloco: "@constAlvo", campo: NAME }
        texto: "alvo = 26 (constante)"

  - id: c4-colisao
    tipo: teoria
    emocao: curioso
    narracao: >-
      Ontem o tiro destruía o asteroide. Hoje o contrário: quando um asteroide encosta
      na sua nave, a nave se machuca. É outra colisão, agora entre a nave e o asteroide.
    ilustracao:
      nome: colisao
      params: { a: nave, b: asteroide }

  - id: c5-nave-apanha
    tipo: pratica
    emocao: neutro
    narracao: >-
      Na Jogo 2D, Quando, pega Quando o sprite encostar num do grupo, com a nave e os
      asteroides, dentro do loop. Lá dentro, Tremer a tela e Fazer a nave piscar.
    acoes:
      - tipo: abrirCategoria
        categoria: "Jogo 2D"
      - tipo: pegarBloco
        bloco: sz_g2d_on_sprite_group_overlap
        encaixarEm: sz_g2d_update_each_frame
        ref: colNave
      - tipo: balao
        ancora: { bloco: "@colNave" }
        texto: "asteroide encosta na nave = dano"
      - tipo: pegarBloco
        bloco: sz_g2d_shake
        encaixarEm: "@colNave"
      - tipo: pegarBloco
        bloco: sz_g2d_blink
        encaixarEm: "@colNave"
      - tipo: balao
        ancora: { bloco: sz_g2d_blink, campo: SPRITE }
        texto: "a nave pisca e fica protegida"

  - id: c6-perde-vida-e-coracoes
    tipo: pratica
    emocao: comemorando
    narracao: >-
      A nave perde uma vida: pega Somar em variável, troca o 1 por menos 1 e escreve
      vidas. E mostra as vidas em corações, ligando a contagem na variável vidas.
    acoes:
      - tipo: abrirCategoria
        categoria: "Programação"
      - tipo: pegarBloco
        bloco: sz_js_var_increment
        encaixarEm: "@colNave"
        ref: perdeVida
      - tipo: configurarCampo
        campo: DELTA
        valor: -1
        bloco: "@perdeVida"
      - tipo: configurarCampo
        campo: NAME
        valor: vidas
        bloco: "@perdeVida"
      - tipo: balao
        ancora: { bloco: "@perdeVida" }
        texto: "cada batida: -1 vida"
      - tipo: abrirCategoria
        categoria: "Jogo 2D"
      - tipo: pegarBloco
        bloco: sz_g2d_draw_hearts
        encaixarEm: sz_g2d_update_each_frame
        ref: coracoes
      - tipo: preencherSoquete
        bloco: sz_val_variable
        emBloco: "@coracoes"
        input: COUNT
        campo: NAME
        valor: vidas
      - tipo: balao
        ancora: { bloco: "@coracoes" }
        texto: "as vidas viram corações"

  - id: c7-o-que-e-tela
    tipo: teoria
    emocao: curioso
    narracao: >-
      Agora a parte mais importante, bem devagar. Um jogo tem vários lugares: começo,
      jogando, vitória e derrota. A gente chama cada um de tela, e usa o Se pra
      perguntar: a tela atual é qual? Se for jogando, roda o jogo.
    ilustracao:
      nome: condicional

  - id: c8-envolver-no-se
    tipo: pratica
    emocao: calmo
    narracao: >-
      Lá em cima, Ir para a tela início. Depois pega um Se e envolve TODO o jogo dentro
      dele, e a pergunta vai ser: a tela atual é jogando? É como guardar o jogo inteiro
      numa caixa que só funciona quando a tela é jogando.
    acoes:
      - tipo: abrirCategoria
        categoria: "Jogo 2D"
      - tipo: pegarBloco
        bloco: sz_g2d_set_scene
        encaixarEm: sz_frame_behavior
        ref: irInicio
      - tipo: configurarCampo
        campo: SCENE
        valor: inicio
        bloco: "@irInicio"
      - tipo: balao
        ancora: { bloco: "@irInicio", campo: SCENE }
        texto: "o jogo abre no início"
      - tipo: envolver
        container: sz_js_if_else
        corpo: THEN
        deDentroDe: sz_g2d_update_each_frame
        inputPai: BODY
        ref: seJogando
      - tipo: preencherSoquete
        bloco: sz_g2d_scene_is
        emBloco: "@seJogando"
        input: COND
        campo: SCENE
        valor: jogando
      - tipo: balao
        ancora: { bloco: "@seJogando" }
        texto: "o jogo todo, só quando a tela é jogando"
      - tipo: zoom
        nivel: ajustar

  - id: c9-ganhar-e-perder
    tipo: pratica
    emocao: neutro
    narracao: >-
      Ainda dentro do jogando, duas perguntas decidem o fim. Vitória: se pontos for
      maior ou igual a alvo, Ir para a tela ganhou. Derrota: se vidas for menor ou
      igual a zero, Ir para a tela perdeu.
    acoes:
      - tipo: abrirCategoria
        categoria: "Programação"
      - tipo: pegarBloco
        bloco: sz_js_if_else
        encaixarEm: "@seJogando"
        ref: seVitoria
      - tipo: preencherSoquete
        bloco: sz_val_compare
        emBloco: "@seVitoria"
        input: COND
        campo: OP
        valor: ">="
        ref: cmpVit
      - tipo: preencherSoquete
        bloco: sz_val_variable
        emBloco: "@cmpVit"
        input: LEFT
        campo: NAME
        valor: pontos
      - tipo: preencherSoquete
        bloco: sz_val_variable
        emBloco: "@cmpVit"
        input: RIGHT
        campo: NAME
        valor: alvo
      - tipo: pegarBloco
        bloco: sz_g2d_set_scene
        encaixarEm: "@seVitoria"
        ref: irGanhou
      - tipo: configurarCampo
        campo: SCENE
        valor: ganhou
        bloco: "@irGanhou"
      - tipo: balao
        ancora: { bloco: "@cmpVit" }
        texto: "se pontos ≥ alvo, você ganhou"
      - tipo: pegarBloco
        bloco: sz_js_if_else
        encaixarEm: "@seJogando"
        ref: seDerrota
      - tipo: preencherSoquete
        bloco: sz_val_compare
        emBloco: "@seDerrota"
        input: COND
        campo: OP
        valor: "<="
        ref: cmpDer
      - tipo: preencherSoquete
        bloco: sz_val_variable
        emBloco: "@cmpDer"
        input: LEFT
        campo: NAME
        valor: vidas
      - tipo: preencherSoquete
        bloco: sz_val_number
        emBloco: "@cmpDer"
        input: RIGHT
        campo: NUM
        valor: 0
      - tipo: pegarBloco
        bloco: sz_g2d_set_scene
        encaixarEm: "@seDerrota"
        ref: irPerdeu
      - tipo: configurarCampo
        campo: SCENE
        valor: perdeu
        bloco: "@irPerdeu"
      - tipo: balao
        ancora: { bloco: "@cmpDer" }
        texto: "se vidas ≤ 0, você perdeu"
      - tipo: zoom
        nivel: ajustar

  - id: c10-tela-inicio
    tipo: pratica
    emocao: neutro
    narracao: >-
      Falta o que cada tela mostra. Ao lado do Se jogando, um Se pra tela de início,
      com o bloco Mostrar tela e o título Nave contra Asteroides.
    acoes:
      - tipo: abrirCategoria
        categoria: "Programação"
      - tipo: pegarBloco
        bloco: sz_js_if_else
        encaixarEm: sz_g2d_update_each_frame
        ref: seTelaInicio
      - tipo: preencherSoquete
        bloco: sz_g2d_scene_is
        emBloco: "@seTelaInicio"
        input: COND
        campo: SCENE
        valor: inicio
      - tipo: pegarBloco
        bloco: sz_g2d_show_screen
        encaixarEm: "@seTelaInicio"
        ref: telaInicio
      - tipo: preencherSoquete
        bloco: sz_val_text
        emBloco: "@telaInicio"
        input: TITLE
        campo: TEXT
        valor: "Nave contra Asteroides"
      - tipo: balao
        ancora: { bloco: "@telaInicio" }
        texto: "a tela de começo do jogo"
      - tipo: zoom
        nivel: ajustar

  - id: c11-enter-troca-tela
    tipo: pratica
    emocao: neutro
    narracao: >-
      Por fim, o Enter troca as telas. Na Jogo 2D, Quando, pega Quando apertar a tecla
      e escolhe Enter, solto fora do loop. Na tela de início, o Enter começa o jogo.
    acoes:
      - tipo: abrirCategoria
        categoria: "Jogo 2D"
      - tipo: pegarBloco
        bloco: sz_g2d_on_key
        encaixarEm: sz_frame_behavior
        ref: aoEnter
      - tipo: configurarCampo
        campo: KEY
        valor: Enter
        bloco: "@aoEnter"
      - tipo: pegarBloco
        bloco: sz_js_if_else
        encaixarEm: "@aoEnter"
        ref: seEnterInicio
      - tipo: preencherSoquete
        bloco: sz_g2d_scene_is
        emBloco: "@seEnterInicio"
        input: COND
        campo: SCENE
        valor: inicio
      - tipo: pegarBloco
        bloco: sz_g2d_set_scene
        encaixarEm: "@seEnterInicio"
        ref: enterJogar
      - tipo: configurarCampo
        campo: SCENE
        valor: jogando
        bloco: "@enterJogar"
      - tipo: balao
        ancora: { bloco: "@aoEnter", campo: KEY }
        texto: "o Enter começa o jogo"
      - tipo: zoom
        nivel: ajustar

  - id: c12-teste
    tipo: teste
    emocao: comemorando
    narracao: >-
      Agora testa do começo ao fim: aperta jogar, aparece a tela de início, Enter,
      atira, deixa um asteroide bater pra ver as vidas caírem, e joga até ganhar ou
      perder. Se algo ficar estranho, é assim mesmo. Arrumar também é criar.

  - id: c13-fecho
    tipo: fecho
    emocao: comemorando
    narracao: >-
      Você conseguiu. Em três dias você criou um jogo de verdade, do zero ao fim, com
      a sua cara. Isso não é sorte nem dom: é seguir os passos com paciência e não
      desistir. Criar é ainda melhor que jogar. Comemora e mostra pra todo mundo. Até!
