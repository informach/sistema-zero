<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" role="img" aria-label="Uma nave dispara em asteroides no espaço">
  <style>
    .ship { transform-origin: 53px 106px; animation: pilot 3s ease-in-out infinite; }
    .rock-one { transform-origin: 132px 49px; animation: tumble 5.5s ease-in-out infinite; }
    .rock-two { transform-origin: 138px 119px; animation: tumble 6.5s ease-in-out reverse infinite; }
    .shot-one { animation: shoot 1.5s ease-in-out infinite; }
    .shot-two { animation: shoot 1.5s ease-in-out .45s infinite; }
    .spark { transform-origin: 110px 74px; animation: pop 1.5s ease-in-out .55s infinite; }
    @keyframes pilot { 0%, 100% { transform: translateY(2px) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
    @keyframes tumble { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
    @keyframes shoot { 0% { opacity: 0; transform: translate(-8px, 6px); } 20%, 70% { opacity: 1; } 100% { opacity: 0; transform: translate(13px, -9px); } }
    @keyframes pop { 0%, 45%, 100% { opacity: 0; transform: scale(.5); } 60% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <circle cx="31" cy="38" r="3" fill="#8A75EF"/>
  <circle cx="78" cy="21" r="2.5" fill="#FFCE62"/>
  <circle cx="164" cy="90" r="3" fill="#64CCBB"/>
  <path d="M23 74h17M17 83h10M67 144h14" stroke="#B4DDEA" stroke-width="3" stroke-linecap="round"/>

  <g class="rock-one">
    <path d="m128 26 17 3 12 13-2 16-14 12-19-2-12-13 4-17Z" fill="#B7A8DF" stroke="#26325B" stroke-width="3" stroke-linejoin="round"/>
    <path d="m128 27 4 15-13 12-8 1 3-17ZM141 69l-1-15 15-12 2 16Z" fill="#8F81C8" opacity=".7"/>
    <circle cx="136" cy="48" r="5" fill="#E5DCF7" stroke="#8679BD" stroke-width="2"/>
    <circle cx="124" cy="58" r="3" fill="#E5DCF7"/>
  </g>

  <g class="rock-two">
    <path d="m135 99 14 3 8 11-3 15-13 10-16-3-7-12 4-16Z" fill="#FFD08D" stroke="#26325B" stroke-width="3" stroke-linejoin="round"/>
    <path d="m135 99 2 12-16 9-3 3 4-16ZM141 138l-3-13 19-12-3 15Z" fill="#F4A968" opacity=".65"/>
    <circle cx="141" cy="116" r="4" fill="#FFF0C9" stroke="#E9A267" stroke-width="2"/>
  </g>

  <g class="shot-one">
    <path d="m80 94 20-14" stroke="#34B9F7" stroke-width="6" stroke-linecap="round"/>
    <path d="m83 92 13-9" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="shot-two">
    <path d="m70 113 20-14" stroke="#FFCB4F" stroke-width="6" stroke-linecap="round"/>
    <path d="m74 110 12-8" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="spark">
    <path d="M110 64v20M100 74h20M103 67l14 14M117 67l-14 14" stroke="#FFB547" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="ship">
    <path d="M18 124c-2 7-1 14 3 20 4-8 9-12 14-15Z" fill="#FF9A5C" stroke="#26325B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M24 128c-1 5-1 9 0 12l7-10Z" fill="#FFE173"/>
    <path d="M41 92c-12 2-19 12-22 23l19-3ZM55 113l1 20c12-5 20-13 21-24Z" fill="#8B75ED" stroke="#26325B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M66 75c-23 4-43 22-42 47 24 1 44-13 53-37Z" fill="#F7FCFF" stroke="#26325B" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M66 75c-9 2-17 6-23 11l25 21c5-6 8-13 9-22Z" fill="#2BA9F2" stroke="#26325B" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="50" cy="103" r="9" fill="#BBEEFB" stroke="#26325B" stroke-width="3"/>
    <path d="m29 119-7 7" stroke="#D3EAF2" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
