<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" role="img" aria-label="Uma nave acende os motores e levanta voo">
  <style>
    .rocket { transform-origin: 90px 75px; animation: hover 3.2s ease-in-out infinite; }
    .flame { transform-origin: 90px 112px; animation: flame 0.85s ease-in-out infinite alternate; }
    .star-a { animation: twinkle 2.4s ease-in-out infinite; }
    .star-b { animation: twinkle 2.4s ease-in-out 1.1s infinite; }
    @keyframes hover { 0%, 100% { transform: translateY(3px) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
    @keyframes flame { from { transform: scaleY(0.8); } to { transform: scaleY(1.16); } }
    @keyframes twinkle { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <ellipse cx="91" cy="144" rx="35" ry="7" fill="#D8E8EF" opacity=".65"/>
  <path d="M24 103h21M17 113h14M140 90h16M147 101h12" stroke="#A9DDEB" stroke-width="4" stroke-linecap="round"/>
  <g class="star-a" style="transform-origin: 34px 38px">
    <path d="M34 29v18M25 38h18" stroke="#FFC947" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="star-b" style="transform-origin: 146px 28px">
    <path d="M146 21v14M139 28h14" stroke="#65CFBA" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle cx="151" cy="69" r="3" fill="#FF9C67"/>
  <circle cx="31" cy="73" r="3" fill="#8E7EF0"/>

  <g class="rocket">
    <g class="flame">
      <path d="M78 108c1 16 8 26 12 32 5-6 12-16 12-32Z" fill="#FF8A53" stroke="#24315A" stroke-width="3" stroke-linejoin="round"/>
      <path d="M84 110c1 10 4 18 6 22 3-4 6-12 7-22Z" fill="#FFE07B"/>
    </g>
    <path d="M70 78c-17 4-21 20-22 35 10-7 20-9 30-9Z" fill="#8A75EF" stroke="#24315A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M110 78c17 4 21 20 22 35-10-7-20-9-30-9Z" fill="#8A75EF" stroke="#24315A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M90 19c-16 11-27 31-27 57 0 14 5 28 12 39h30c7-11 12-25 12-39 0-26-11-46-27-57Z" fill="#F7FCFF" stroke="#24315A" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M90 19c-10 7-18 17-22 30h44c-4-13-12-23-22-30Z" fill="#269FED" stroke="#24315A" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M73 100h34l-5 15H78Z" fill="#2BA9F2" stroke="#24315A" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="90" cy="74" r="15" fill="#B9EBFA" stroke="#24315A" stroke-width="3.5"/>
    <path d="M83 67c3-3 7-4 11-3" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M77 91h26" stroke="#D8ECF4" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
