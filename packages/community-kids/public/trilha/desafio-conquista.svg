<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" role="img" aria-label="Jogo espacial concluído com uma medalha de conquista">
  <style>
    .medal { transform-origin: 138px 50px; animation: celebrate 3.4s ease-in-out infinite; }
    .shine { transform-origin: 138px 50px; animation: gleam 2.8s ease-in-out infinite; }
    .confetti-one { animation: fall 3s ease-in-out infinite; }
    .confetti-two { animation: fall 3s ease-in-out .8s infinite; }
    .screen-star { animation: blink 2.2s ease-in-out infinite; }
    @keyframes celebrate { 0%, 100% { transform: translateY(1px) rotate(-5deg); } 50% { transform: translateY(-5px) rotate(5deg); } }
    @keyframes gleam { 0%, 100% { opacity: .35; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes fall { 0%, 100% { transform: translateY(-3px) rotate(-12deg); } 50% { transform: translateY(7px) rotate(15deg); } }
    @keyframes blink { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <ellipse cx="91" cy="146" rx="66" ry="6" fill="#D8E8EF" opacity=".6"/>
  <g class="confetti-one">
    <path d="M29 33h10M34 28v10" stroke="#FF9E72" stroke-width="4" stroke-linecap="round"/>
    <rect x="157" y="96" width="7" height="7" rx="2" transform="rotate(20 160.5 99.5)" fill="#8D7AED"/>
  </g>
  <g class="confetti-two">
    <circle cx="56" cy="15" r="3" fill="#60CEB7"/>
    <path d="m149 18 6 4-4 6" fill="none" stroke="#FFBE48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="27" cy="111" r="3" fill="#8D7AED"/>
  </g>

  <path d="M27 53a8 8 0 0 1 8-8h91a8 8 0 0 1 8 8v66a8 8 0 0 1-8 8H35a8 8 0 0 1-8-8Z" fill="#F7FCFF" stroke="#26325B" stroke-width="3.5"/>
  <path d="M35 57a4 4 0 0 1 4-4h83a4 4 0 0 1 4 4v51H35Z" fill="#334078"/>
  <path d="M27 113h107v6a8 8 0 0 1-8 8H35a8 8 0 0 1-8-8Z" fill="#B8E8F8" stroke="#26325B" stroke-width="3"/>
  <path d="M61 127h40l9 15H52Z" fill="#86C8EE" stroke="#26325B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M45 142h72" stroke="#26325B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="45" cy="62" r="2.5" fill="#FFCE62"/>
  <circle cx="115" cy="70" r="2" fill="#78D7C8"/>
  <g class="screen-star">
    <path d="M104 82v12M98 88h12" stroke="#FFCE62" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="m69 93 10-20 10 20-10-5Z" fill="#55CAF0" stroke="#DDFBFF" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="m70 92-8 10 12-3M88 92l8 10-12-3" fill="#8E7EF0" stroke="#DDFBFF" stroke-width="2" stroke-linejoin="round"/>
  <path d="M76 95v8l3 5 3-5v-8" fill="#FFCE62"/>

  <g class="medal">
    <path d="m122 57-3 24 16-9 13 11 3-27" fill="#56BFEA" stroke="#26325B" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="137" cy="48" r="23" fill="#FFCB4F" stroke="#26325B" stroke-width="3.5"/>
    <circle cx="137" cy="48" r="16" fill="#FFE596" stroke="#EFAF35" stroke-width="2.5"/>
    <path d="m137 37 3.5 7 7.5 1-5.5 5.5 1.5 8-7-4-7 4 1.5-8-5.5-5.5 7.5-1Z" fill="#FFB747" stroke="#A86E2D" stroke-width="1.7" stroke-linejoin="round"/>
    <g class="shine">
      <path d="M137 13v8M113 25l6 6M161 25l-6 6" stroke="#FFD46B" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
