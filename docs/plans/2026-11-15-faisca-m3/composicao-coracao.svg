<text x="68" y="890" font-size="13" fill="#283e37" >Sólidos cinza: modelos atuais · areia: áreas de chegada propostas · verde tracejado: agrupamentos propostos</text>
<text x="910" y="162" font-size="18" fill="#29473b" font-weight="700">02  ENQUADRAMENTO DO M3</text>
<text x="915" y="210" font-size="19" fill="#9c6c33" font-weight="700">01</text><text x="959" y="210" font-size="19" fill="#283e37" font-weight="700">Praça que convida a ficar</text><text x="959" y="235" font-size="14" fill="#57685d" >Poço como encontro; Quadro fora da faixa de passagem.</text><text x="915" y="285" font-size="19" fill="#9c6c33" font-weight="700">02</text><text x="959" y="285" font-size="19" fill="#283e37" font-weight="700">Frentes com funções diferentes</text><text x="959" y="310" font-size="14" fill="#57685d" >Correio: encomendas; Pátio: peças e lacre visível.</text><text x="915" y="360" font-size="19" fill="#9c6c33" font-weight="700">03</text><text x="959" y="360" font-size="19" fill="#283e37" font-weight="700">Natureza em grupos</text><text x="959" y="385" font-size="14" fill="#57685d" >Bordas baixas perto da câmera; árvores nas laterais.</text><text x="915" y="435" font-size="19" fill="#9c6c33" font-weight="700">04</text><text x="959" y="435" font-size="19" fill="#283e37" font-weight="700">Duas aproximações contínuas</text><text x="959" y="460" font-size="14" fill="#57685d" >Cabeceiras assentadas; manter piso e colisão da ponte.</text><text x="915" y="510" font-size="19" fill="#9c6c33" font-weight="700">05</text><text x="959" y="510" font-size="19" fill="#283e37" font-weight="700">Farol inteiro no horizonte</text><text x="959" y="535" font-size="14" fill="#57685d" >Patamar e acesso; sem alterar os 24 m do modelo.</text><text x="915" y="585" font-size="19" fill="#9c6c33" font-weight="700">06</text><text x="959" y="585" font-size="19" fill="#283e37" font-weight="700">Dois percursos representativos</text><text x="959" y="610" font-size="14" fill="#57685d" >Azul: horta e lago. Cobre: Pátio, encosta e Farol.</text>
<text x="915" y="685" font-size="15" fill="#29473b" font-weight="700">NÓS DE COMPOSIÇÃO NO MAPA</text>
<text x="917" y="715" font-size="13" fill="#283e37" >1  Praça: poço + Quadro</text><text x="1225" y="715" font-size="13" fill="#283e37" >2  Correio: frente de uso</text><text x="917" y="744" font-size="13" fill="#283e37" >3  Pátio: oficina lacrada</text><text x="1225" y="744" font-size="13" fill="#283e37" >4  Campos: canteiros e ofício</text><text x="917" y="773" font-size="13" fill="#283e37" >5  Lago: duas cabeceiras</text><text x="1225" y="773" font-size="13" fill="#283e37" >6  Farol: chegada e patamar</text><text x="917" y="802" font-size="13" fill="#283e37" >7  Pausa entre horta e ponte</text><text x="1225" y="802" font-size="13" fill="#283e37" >8  Mirante na encosta</text>
<rect x="910" y="844" width="642" height="65" fill="#f0e4c9" rx="8"/><text x="926" y="869" font-size="16" fill="#745a30" font-weight="700">As manchas e os objetos sugeridos são propostas.</text><text x="926" y="892" font-size="15" fill="#745a30" >Não são capturas de um cenário já montado ou aprovado.</text>
<rect x="44" y="931" width="1510" height="88" fill="#e7eadd" rx="8"/><text x="62" y="957" font-size="13" fill="#436150" font-weight="700">PRESERVAR</text>
<text x="62" y="982" font-size="18" fill="#283e37" >Porta–praça 13 m · praça–horta ≈20 m · praça–Pátio ≈25 m · escala nativa · seis distritos e cabeceiras</text>
<text x="62" y="1005" font-size="15" fill="#57685d" >Proposta: caminhos principais 2,4–2,8 m fora das praças; centro aberto; nenhum volume alto no corredor visual.</text>
</svg>