<text x="750" y="162" font-size="18" fill="#29473b" font-weight="700">PRODUÇÃO CONCENTRADA</text>
<text x="750" y="195" font-size="17" fill="#283e37" >Retângulo azul: praça, horta/lago, Pátio e Farol.</text>
<text x="750" y="224" font-size="17" fill="#283e37" >Duas rotas piloto e seus retornos.</text><text x="750" y="253" font-size="17" fill="#283e37" >Nenhuma mudança de escala ou cabeceiras.</text>
<text x="750" y="315" font-size="18" fill="#965a38" font-weight="700">EXPLORAÇÃO EXTERIOR</text>
<text x="750" y="348" font-size="17" fill="#283e37" >Trecho pontilhado: 202,48 m entre controles.</text><text x="750" y="377" font-size="17" fill="#283e37" >Planejar vistas e descobertas; não encurtar</text><text x="750" y="401" font-size="17" fill="#283e37" >ou espalhar decoração automaticamente.</text>
<text x="750" y="458" font-size="18" fill="#29473b" font-weight="700">DISTRITOS PRESERVADOS</text>
<text x="750" y="491" font-size="17" fill="#283e37" >A  Vila dos Criadores</text><text x="750" y="520" font-size="17" fill="#283e37" >B  Campos da Íris</text><text x="750" y="549" font-size="17" fill="#283e37" >C  Costa do Nico</text><text x="750" y="578" font-size="17" fill="#283e37" >D  Pátio das Invenções</text><text x="750" y="607" font-size="17" fill="#283e37" >E  Colina do Farol</text><text x="750" y="636" font-size="17" fill="#283e37" >F  Bosque das Lanternas</text>
<rect x="39" y="744" width="1220" height="69" fill="#eee4cf" rx="8"/><text x="57" y="771" font-size="16" fill="#675737" font-weight="700">GEOGRAFIA E ROTAS: dados atuais do V2. ÁREA AZUL: proposta de produção M3.</text><text x="57" y="797" font-size="15" fill="#675737" >O mapa mostra alcance e lacunas. Não demonstra conteúdo já produzido, teste com crianças ou aprovação artística.</text></svg>