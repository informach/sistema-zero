<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="850" viewBox="0 0 1300 850" font-family="Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Faísca M3: alcance da produção e trechos ainda em estudo</title><desc id="d">Seis distritos e seis saídas na geografia de 520 m. A produção se concentra no coração sul e duas rotas curtas. O segmento exterior de 202 metros permanece em estudo.</desc>
<rect x="0" y="0" width="1300" height="850" fill="#f6f3ea" /><rect x="0" y="0" width="1300" height="108" fill="#203b34" /><text x="35" y="42" font-size="15" fill="#c9dfcb" letter-spacing="2">FAÍSCA M3 / MAPA DE ALCANCE</text><text x="35" y="81" font-size="29" fill="#fff8e8" font-weight="700">Compor um trecho. Preservar o território.</text>
