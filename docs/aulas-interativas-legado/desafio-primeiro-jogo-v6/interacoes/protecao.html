<style>
*{box-sizing:border-box}body{margin:0;padding:12px;color:#152f44;background:#eef5fa;font:16px/1.5 "Trebuchet MS",sans-serif}.lab{max-width:780px;margin:auto}h2{font-size:clamp(24px,4vw,32px);line-height:1.18;margin:8px 0 12px}p{margin:10px 0}.eyebrow{font-size:12px;font-weight:bold;letter-spacing:2px;color:#476377}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{font:inherit;min-height:46px;border:2px solid #386386;border-radius:12px;padding:9px 14px;background:white;color:#173c59;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{background:#173c59;color:white}button:focus-visible{outline:3px solid #a75400;outline-offset:3px}button:disabled{opacity:.65;cursor:default}.stage{background:#112b46;color:#eff9ff;border:1px solid #58718b;border-radius:18px;padding:14px}.stage svg{width:100%;display:block;max-height:280px}#caption{min-height:48px}#run{background:#ffd184;border-color:#9a611a;font-weight:bold;margin:14px 8px 4px 0}.results{margin-top:16px;padding:16px;border:1px solid #86a1b5;background:#fff;border-radius:14px}.results h3{margin:0 0 10px;font-size:18px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.comparison>div{min-width:0}.comparison h4{font-size:14px;margin:12px 0 8px}.comparison .stage{padding:8px}.comparison svg{max-height:150px}.comparison p{font-size:14px}.done{font-weight:bold;border-left:4px solid #1f7865;padding-left:12px}.lab[data-complete=true]>.stage{display:none}.note{font-size:14px;color:#476377}@media(max-width:420px){body{padding:8px}.choices button{flex:1 1 120px}.stage{padding:10px}.results{padding:12px}.comparison{gap:8px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><main class="lab"><span class="eyebrow">UMA IDEIA · DUAS SITUAÇÕES</span><h2 id="title"></h2><p id="prompt"></p><div class="choices" role="group" aria-label="Situação para comparar"><button id="option-0" type="button" aria-pressed="true"></button><button id="option-1" type="button" aria-pressed="false"></button></div><div class="stage"><div id="scene"></div><p id="caption" aria-live="polite"></p></div><button id="run" type="button">Avançar a comparação</button><span id="progress" role="status"></span><p class="note">Você controla o ritmo. Modelo didático separado do seu jogo.</p><section class="results" aria-label="Resultados guardados"><h3>Sua comparação</h3><p id="records">Os resultados aparecem aqui ao terminar cada situação.</p><div id="comparison" class="comparison"></div><p id="done" class="done" hidden></p></section></main>
<script>(()=>{'use strict';const c={"kind":"protecao","title":"Um respiro depois da batida","prompt":"A nave começa com 3 vidas. Três asteroides diferentes batem nos quadros 1, 6 e 11.","options":["Proteção de 0 quadros","Proteção de 45 quadros"],"steps":3,"results":["Sem proteção, as três batidas tiraram três vidas.","Com proteção, apenas a primeira batida tirou vida."],"conclusion":"A proteção ignora novos danos por um tempo. Cada asteroide que bate é removido nos dois casos."},$=id=>document.getElementById(id);let selected=0,step=0,tested=[],ready=!window.learning;
const ship=(x,y,opacity=1)=>'<g opacity="'+opacity+'" transform="translate('+x+' '+y+')"><path d="M27 0L54 54L35 46L27 62L19 46L0 54Z" fill="#93e2ee"/><path d="M23 16h8v20h-8Z" fill="#2874a6"/></g>';
const stone=(x,y)=>'<g transform="translate('+x+' '+y+')"><path d="M0 12L14 0L37 4L46 23L35 43L10 46L-3 30Z" fill="#e8b77b"/><circle cx="15" cy="18" r="6" fill="#98724e"/></g>';
function scene(option,n){let art='',caption='',view='0 0 800 480';const initial=n===0;
if(c.kind==='coordenadas'){const y=option?410:110;art='<path d="M0 0H800M0 0V480M400 0V480" stroke="#638cac" stroke-width="3" stroke-dasharray="10 10"/><text x="15" y="38">0</text><text x="675" y="38">x → 800</text><text x="12" y="460">y ↓ 480</text>'+(!initial?ship(400,y)+'<circle cx="400" cy="'+y+'" r="7" fill="#ffd184"/>':'');caption=initial?'Aperte Mostrar posição.':'x = 400 · y = '+y+'. A marca é o canto superior esquerdo da caixa.';}
if(c.kind==='limpeza'){for(let i=0;i<n;i++)if(!option||i===n-1)art+=ship(150+i*190,205,(!option&&i<n-1)?.45:1);caption='Quadro '+n+' · '+(option?Math.min(1,n):n)+' desenho(s) na tela · 1 nave no jogo.';}
if(c.kind==='direcao'){const y=240+(option?1:-1)*n*90;art='<path d="M400 0V480" stroke="#638cac" stroke-width="3" stroke-dasharray="10 10"/><circle cx="400" cy="240" r="14" fill="none" stroke="#9eb4c7" stroke-width="3"/>'+(y>=0&&y<=480?'<circle cx="400" cy="'+y+'" r="12" fill="#ffd184"/>':'<text x="235" y="'+(y<0?45:440)+'">Saiu '+(y<0?'por cima':'por baixo')+'</text>');caption=(n*10)+' quadros · y = '+y+' · '+(n?'o tiro '+(option?'desce':'sobe'):'mesmo ponto de partida')+'.';}
if(c.kind==='intervalo'){view='0 0 340 220';const births=n*(option?1:2);for(let i=0;i<births;i++)art+=stone(35+(i%3)*110,40+Math.floor(i/3)*95);caption=n*40+' quadros observados · '+births+' nascimento(s). Mesma queda nos dois testes.';}
if(c.kind==='protecao'){view='0 0 220 180';const hp=3-(option?Math.min(1,n):n);art=ship(83,105);for(let i=0;i<3;i++)art+='<text x="'+(32+i*65)+'" y="65" fill="'+(i<hp?'#ffb2ab':'#718296')+'">'+(i<hp?'♥':'♡')+'</text>';caption=n===0?'3 vidas · aguardando a primeira batida.':'Batida '+n+' (quadro '+(1+(n-1)*5)+') · '+hp+' vida(s) · asteroide removido'+(option&&n>1?' · dano ignorado pela proteção.':'.');}
if(c.kind==='telas'){if(option){for(let i=0;i<n;i++)art+=stone(120+i*220,145);art+=ship(373,365);}else art='<text x="170" y="200">Nave contra Asteroides</text><text x="225" y="265">Aperte Enter</text>';caption=n+' toque(s) do relógio · '+(option?n:0)+' nascimento(s) · condição '+(option?'verdadeira':'falsa')+'.';}
return {art:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+view+'" role="img" aria-label="'+caption+'" style="font:32px sans-serif;fill:#eff9ff">'+art+'</svg>',caption};}
function resize(){const css=getComputedStyle(document.body);window.learning?.resize(Math.max(180,Math.ceil(document.querySelector('.lab').getBoundingClientRect().height+parseFloat(css.paddingTop)+parseFloat(css.paddingBottom))))}
function save(){window.learning?.save({selected,step,tested:[...tested]})}
function render(){const complete=tested.length===2,view=scene(selected,step);document.querySelector('.lab').dataset.complete=String(complete);$('scene').innerHTML=view.art;$('caption').textContent=view.caption;for(let i=0;i<2;i++){$('option-'+i).textContent=c.options[i];$('option-'+i).setAttribute('aria-pressed',String(i===selected));$('option-'+i).disabled=!ready||complete;}$('run').disabled=!ready||complete||tested.includes(String(selected));$('run').textContent=complete?'Comparação guardada':tested.includes(String(selected))?'Situação guardada':c.steps===1?'Mostrar posição':'Avançar · passo '+(step+1)+' de '+c.steps;$('progress').textContent=tested.length+' de 2 situações guardadas';$('records').hidden=complete;$('records').textContent=tested.length?tested.map(i=>c.results[Number(i)]).join(' '):'Os resultados aparecem aqui ao terminar cada situação.';$('comparison').innerHTML=complete?[0,1].map(i=>'<div><h4>'+c.options[i]+'</h4><div class="stage">'+scene(i,c.steps).art+'</div><p>'+c.results[i]+'</p></div>').join(''):'';$('done').hidden=!complete;$('done').textContent=c.conclusion+' Agora responda à pergunta da aula.';resize()}
for(let i=0;i<2;i++)$('option-'+i).addEventListener('click',()=>{if(tested.length===2||selected===i)return;selected=i;step=tested.includes(String(i))?c.steps:0;save();render()});$('run').addEventListener('click',()=>{if(tested.length===2||tested.includes(String(selected)))return;step++;if(step===c.steps)tested=[...new Set([...tested,String(selected)])].sort();save();render();if(tested.length===2)window.learning?.participated()});
addEventListener('learning:restore',event=>{ready=true;const s=event.detail&&typeof event.detail==='object'?event.detail:{};selected=s.selected===1?1:0;tested=Array.isArray(s.tested)?[...new Set(s.tested.filter(i=>i==='0'||i==='1'))].sort():[];step=Number.isInteger(s.step)?Math.max(0,Math.min(c.steps,s.step)):0;if(tested.includes(String(selected)))step=c.steps;else if(step===c.steps)step=0;render()});$('title').textContent=c.title;$('prompt').textContent=c.prompt;addEventListener('resize',resize);if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(document.querySelector('.lab'));render();})();</script>
