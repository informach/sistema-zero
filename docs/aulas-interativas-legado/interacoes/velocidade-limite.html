<h2>Acelerar tem um limite</h2>
<p>A velocidade começa em −5. A cada passo, subtraímos 1 se ela ainda for maior que o limite. O cacto anda para a esquerda.</p>
<label for="limit">Limite <output id="value">−9</output></label><input id="limit" type="range" min="-14" max="-6" step="1" value="-9">
<button id="step" type="button">Passar 5 segundos</button><button id="reset" type="button">Recomeçar em −5</button>
<svg viewBox="0 0 400 130" role="img" aria-label="Deslocamento para a esquerda durante um quadro" style="display:block;width:100%;background:#fff;border-radius:12px"><path id="distance" d="M340 65H290" stroke="#1762bc" stroke-width="12"/><text x="15" y="30" fill="#152746" id="speed">Velocidade: −5</text><text x="15" y="115" fill="#152746">A linha mostra a distância percorrida em um quadro (ampliada).</text></svg>
<p id="status" aria-live="polite">Compare o número com o comprimento do deslocamento.</p>
<script>
(()=>{let speed=-5,steps=0;const limit=document.getElementById('limit');function render(){document.getElementById('value').textContent=limit.value;document.getElementById('speed').textContent=`Velocidade: ${speed}`;document.getElementById('distance').setAttribute('d',`M340 65H${340+speed*15}`)}function save(){window.learning?.save({speed,limit:Number(limit.value),steps})}
limit.addEventListener('input',()=>{speed=-5;steps=0;render();save()});document.getElementById('step').addEventListener('click',()=>{if(speed>Number(limit.value))speed--;steps++;render();document.getElementById('status').textContent=speed===Number(limit.value)?'Chegou ao limite. Outro passo deve manter este valor.':'O número diminuiu; a distância por quadro aumentou.';save();if(speed===Number(limit.value)&&steps>Math.abs(Number(limit.value)+5))window.learning?.participated()});document.getElementById('reset').addEventListener('click',()=>{speed=-5;steps=0;render();save()});addEventListener('learning:restore',event=>{const s=event.detail;speed=Number.isFinite(s.speed)?s.speed:-5;limit.value=Number.isFinite(s.limit)?s.limit:-9;steps=Number.isFinite(s.steps)?s.steps:0;render()});render()})();
</script>
