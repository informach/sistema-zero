<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f5f2e9;color:#20323c;font:16px/1.5 "Trebuchet MS",sans-serif}.lab{max-width:800px;margin:auto}h2{font-size:clamp(23px,4vw,32px);line-height:1.15;letter-spacing:-.5px;margin:8px 0 12px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#47646a}.intro{margin:0 0 16px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;min-height:46px;padding:9px 14px;border:2px solid #45606a;border-radius:12px;background:#fff;color:#20323c;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{background:#163f48;color:#fff;border-color:#163f48}button:focus-visible{outline:3px solid #b35400;outline-offset:3px}button:disabled{cursor:default;opacity:.65}.stage{border:1px solid #45606a;background:#102b35;border-radius:18px;padding:16px;color:#f9f5e8}.stage svg{display:block;width:100%;height:auto;max-height:250px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:12px}.panel{min-width:0;text-align:center}.panel p{margin:8px 0 0;font-size:14px}.graphic{height:180px;display:grid;place-items:center}.graphic svg{max-height:160px}.tag{font-size:13px;color:#aed4d5;display:block;margin-bottom:8px}.caption{min-height:48px;margin:12px 0 0;font-size:15px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}.run{background:#f9c267;border-color:#9c5c10;font-weight:bold}.note{font-size:14px;color:#45606a}.results{margin-top:14px;padding:16px;border:1px solid #879797;border-radius:14px;background:#fff}.results h3{font-size:18px;margin:0 0 8px}.results ul{padding-left:20px;margin:0}.done{border-left:4px solid #217264;padding-left:12px;font-weight:bold}.comparison{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px}.comparison .stage{padding:12px}.comparison .graphic{height:145px}.comparison .stage svg{max-height:145px}.comparison .caption{font-size:13px}.comparison h4{margin:0 0 8px;font-size:15px}@media(max-width:420px){body{padding:8px}.stage{padding:12px}.choices button{flex:1 1 120px}.graphic{height:145px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lab[data-complete=true]>.stage{display:none}.comparison .row{grid-template-columns:repeat(2,minmax(0,1fr))}
</style>
<main class="lab"><span class="eyebrow">COMPARE DUAS SITUAÇÕES</span><h2 id="title"></h2><p class="intro" id="prompt"></p>
<div class="choices" role="group" aria-label="Situação para comparar"><button type="button" id="option-0" aria-pressed="true"></button><button type="button" id="option-1" aria-pressed="false"></button></div>
<div class="stage"><div id="scene"></div><p class="caption" id="caption"></p></div>
<div class="actions"><button type="button" class="run" id="run">Testar e guardar resultado</button><span id="progress" role="status" aria-live="polite">0 de 2 situações registradas</span></div>
<p class="note" id="motion-note"></p><section class="results" aria-label="Resultados guardados"><h3>O que você observou</h3><ul id="records"></ul><p class="done" id="done" hidden></p><div class="comparison" id="comparison"></div></section></main>
<script>
(()=>{'use strict';const config={"kind":"quadros","title":"O que faz o motor pulsar?","prompt":"Dois quadros, sempre a 8 fps. Só o desenho do segundo fogo muda.","options":["Dois fogos iguais","Fogo pequeno e grande"],"results":["Trocar dois desenhos iguais não muda a aparência.","A diferença no fogo aparece como uma pulsação. O corpo fica no lugar."],"takeaway":"Duplicar guarda a base. Alterar a cópia cria a mudança visível."};const $=id=>document.getElementById(id);let selected=0,tested=[],tick=0,timer=null,busy=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const svg=(body,view='0 0 32 32',label='Exemplo visual')=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+view+'" role="img" aria-label="'+label+'">'+body+'</svg>';
const ship=(long=false)=>'<path d="M15 3h2v3h2v4h2v7h5v5h-7v2h-6v-2H6v-5h5v-7h2V6h2Z" fill="#9de2dd"/><path d="M14 9h4v8h-4Z" fill="#286f93"/><path d="M13 24h6v'+(long?4:2)+'h-2v'+(long?3:1)+'h-2v-'+(long?3:1)+'h-2Z" fill="#f6a347"/><path d="M15 24h2v3h-2Z" fill="#ffe7ad"/>';
const stone='<path d="M8 14Q13 10 20 13Q27 16 25 24Q22 29 15 28Q6 29 5 22Q4 17 8 14" fill="#c3a79e"/><ellipse cx="12" cy="19" rx="3" ry="2" fill="#716171"/><ellipse cx="21" cy="23" rx="2" ry="1.4" fill="#716171"/>';
const flame='<path d="M5 21L6 5L11 11L16 1L19 9L25 4L28 22Q24 28 16 27Q7 28 5 21Z" fill="#f3a34f"/>';
function panel(label,art){return '<div class="panel"><span class="tag">'+label+'</span>'+art+'</div>'}
function raster(){const cv=document.createElement('canvas');cv.width=16;cv.height=16;const ctx=cv.getContext('2d');const path='M2 7Q3 1 9 2Q16 3 14 10Q11 16 5 13Q1 12 2 7Z';ctx.fill(new Path2D(path));const data=ctx.getImageData(0,0,16,16).data;let squares='';for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(data[(y*16+x)*4+3]>=128)squares+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';return {path,squares}}
const pixelStone=config.kind==='bordas'?raster():null;
function renderScene(option,frame=0,snapshot=false){
if(config.kind==='espelho'){const grid='<defs><pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#33515a" stroke-width=".06"/></pattern></defs><rect width="32" height="32" fill="url(#grid)"/><path d="M16 0V32" stroke="#f5c777" stroke-width=".2" stroke-dasharray="1 1"/>';const line='<path d="M12.5 5.5L7.5 20.5" fill="none" stroke="#9de2dd" stroke-width="1"/>';return svg(grid+line+(option?'<g transform="translate(32 0) scale(-1 1)">'+line+'</g>':''),'0 0 32 32','Mesmo traço à esquerda'+(option?' e sua cópia simétrica à direita':'')+' do eixo central');}
if(config.kind==='quadros')return '<div class="row">'+panel('Quadro 1',svg(ship(false)))+panel('Quadro 2',svg(ship(option===1)))+(snapshot?'':panel('Prévia · 8 fps',svg(ship(option===1&&frame%2===1))))+'</div>';
if(config.kind==='bordas'){const size=option?128:16;return '<div class="row">'+panel('Pixels · '+(option?'8×':'1×'),'<div class="graphic">'+svg('<g fill="#9de2dd" shape-rendering="crispEdges">'+pixelStone.squares+'</g>','0 0 16 16','Borda representada por pixels').replace('<svg ','<svg style="width:'+size+'px;height:'+size+'px" ')+'</div>')+panel('Vetor · '+(option?'8×':'1×'),'<div class="graphic">'+svg('<path d="'+pixelStone.path+'" fill="#9de2dd"/>','0 0 16 16','Mesma silhueta descrita como forma vetorial').replace('<svg ','<svg style="width:'+size+'px;height:'+size+'px" ')+'</div>')+'</div>';}
if(config.kind==='ordem')return svg(option?flame+stone:stone+flame,'0 0 32 32',option?'Pedra inteira na frente da chama':'Chama cobrindo parte da pedra')+'<p class="tag">Na frente: '+(option?'pedra':'chama')+' · Atrás: '+(option?'chama':'pedra')+'</p>';
const width=option?32:16;return '<div class="row">'+panel('Folha inteira · 64 × 32',svg(ship(false)+'<g transform="translate(32 0)">'+ship(true)+'</g><path d="M32 0V32" stroke="#60808a" stroke-width=".3"/><rect x=".3" y=".3" width="'+(width-.6)+'" height="31.4" stroke="#f9c267" stroke-width=".6" fill="none"/>','0 0 64 32','Folha de duas naves com o recorte destacado'))+panel('No jogo · 54 × 54', '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" role="img" aria-label="Resultado do recorte num sprite de 54 por 54"><svg width="54" height="54" viewBox="0 0 '+width+' 32" preserveAspectRatio="none" overflow="hidden">'+ship(false)+'</svg></svg>')+'</div>';
}
function resize(){const style=getComputedStyle(document.body);const height=document.querySelector('.lab').getBoundingClientRect().height+parseFloat(style.paddingTop)+parseFloat(style.paddingBottom);window.learning?.resize(Math.max(180,Math.ceil(height)))}
function save(){window.learning?.save({selected,tested:[...tested]})}
function render(){const complete=tested.length===2;document.querySelector('.lab').dataset.complete=String(complete);for(let i=0;i<2;i++){$('option-'+i).textContent=config.options[i];$('option-'+i).setAttribute('aria-pressed',String(selected===i));$('option-'+i).disabled=complete||busy;}$('scene').innerHTML=renderScene(selected,tick);$('caption').textContent=config.results[selected];$('run').disabled=complete||busy||tested.includes(String(selected));$('run').textContent=complete?'Comparação guardada':busy?'Observe a sequência…':tested.includes(String(selected))?'Resultado já guardado':'Testar e guardar resultado';$('progress').textContent=tested.length+' de 2 situações registradas';$('records').replaceChildren(...tested.map(i=>{const li=document.createElement('li');li.textContent=config.options[Number(i)]+': '+config.results[Number(i)];return li}));$('done').hidden=!complete;$('done').textContent=config.takeaway+' Agora responda à pergunta da aula.';$('comparison').innerHTML=complete?[0,1].map(i=>'<div><h4>'+config.options[i]+'</h4><div class="stage">'+renderScene(i,1,true)+'</div></div>').join(''):'';resize()}
function finish(){if(timer!==null)clearInterval(timer);timer=null;busy=false;if(!tested.includes(String(selected)))tested.push(String(selected));tested.sort();save();render();if(tested.length===2)window.learning?.participated()}
function stop(){if(timer!==null)clearInterval(timer);timer=null;busy=false;tick=0}
$('title').textContent=config.title;$('prompt').textContent=config.prompt;
function motionNote(){$('motion-note').textContent=config.kind==='quadros'?(reduced.matches?'Movimento reduzido: compare os dois desenhos parados.':'O teste toca uma sequência de 2 segundos. Os quadros parados ficam visíveis ao lado.'):'Olhe o resultado e guarde cada situação uma vez.'}
for(let i=0;i<2;i++)$('option-'+i).addEventListener('click',()=>{if(busy||tested.length===2)return;selected=i;tick=0;save();render()});
$('run').addEventListener('click',()=>{if(busy||tested.length===2||tested.includes(String(selected)))return;if(config.kind!=='quadros'||reduced.matches){finish();return}busy=true;tick=0;render();timer=setInterval(()=>{tick++;$('scene').innerHTML=renderScene(selected,tick);if(tick>=16)finish()},125)});
addEventListener('learning:restore',event=>{stop();const state=event.detail&&typeof event.detail==='object'?event.detail:{};selected=state.selected===1?1:0;tested=Array.isArray(state.tested)?[...new Set(state.tested.filter(i=>i==='0'||i==='1'))].sort():[];if(tested.length===1&&tested.includes(String(selected)))selected=selected?0:1;render()});
reduced.addEventListener('change',()=>{motionNote();if(busy&&reduced.matches){stop();render()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&busy){stop();render()}});addEventListener('pagehide',stop);addEventListener('resize',resize);if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(document.querySelector('.lab'));motionNote();render();
})();
</script>
