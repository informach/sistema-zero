e de duas partidas com velocidades diferentes. O ponto inicial é marcado por círculo vazado, e o rastro amarelo sobreposto liga a posição inicial à final registrada. Na versão mais devagar, a bola avança menos. Um desenho ampliado dos trajetos facilita a comparação. Exemplo preparado pela equipe."></a><figcaption>04 / 06</figcaption></figure><figure><a href="05-p34.png"><img src="05-p34.png" alt="As duas versões reais do jogo aparecem lado a lado. A versão mais devagar tem contorno amarelo, associada ao objetivo de dar mais tempo para mover a raquete. O texto convida a testar outra velocidade caso fique fácil demais. Não é um projeto atribuído ao Rafael."></a><figcaption>05 / 06</figcaption></figure><figure><a href="06-p34.png"><img src="06-p34.png" alt="Fundo azul, título branco e convite em faixa amarela. No centro, a ilustração do caderno com as duas ideias para o jogo. O convite para seguir o perfil ocupa um slide separado da conclusão."></a><figcaption>06 / 06</figcaption></figure></main><p class="details">Relato real de Daniel, pai do Rafael. Exemplo do jogo preparado pela equipe. Nada foi agendado ou publicado.</p></html>
