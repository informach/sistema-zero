# Deploy de PRODUÇÃO sob demanda (workflow_dispatch) — automatiza o "deploy
# manual deliberado" descrito em docs/ambientes-e-fluxo.md usando o MESMO
# mecanismo do deploy-staging: GraphQL `serviceInstanceDeployV2` com o sha da
# MAIN. Segurança: só deploya serviço que JÁ TEM deployment no environment
# production (nunca "estreia" um serviço sem env configurada — ex.: hub).
# Uso: informar o SHA completo de main e os serviços da onda explicitamente.
name: Deploy produção

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Serviços desta onda, em CSV (ex.: catalog,members)'
        required: true
      expected_sha:
        description: 'SHA completo de main aprovado para esta onda'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API: https://backboard.railway.com/graphql/v2
      PROJECT_ID: 415d5a1c-5f75-432c-8445-b395d0977ce3
      FORCED: ${{ github.event.inputs.services }}
      EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
      HELPDESK_SERVICE_ID: ${{ vars.RAILWAY_HELPDESK_SERVICE_ID }}
      HELPDESK_APP_SERVICE_ID: ${{ vars.RAILWAY_HELPDESK_APP_SERVICE_ID }}
    steps:
      - name: Deployar produção com o sha da main
        run: |
          set -euo pipefail

          gql() {
            local result
            result=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $RAILWAY_TOKEN" -H 'content-type: application/json' -d "$1" "$RAILWAY_API")
            echo "$result" | jq -e '(.errors // [] | length) == 0 and .data != null' >/dev/null || { echo '::error::Railway recusou a operação' >&2; return 1; }
            echo "$result"
          }

          # ids dos serviços no Railway (não são segredo; espelham o ci.yml)
          declare -A SVC_ID=(
            [api-gateway]=2b7748bc-d3e3-4aff-bd94-3f514b53c44f
            [auth]=8c57d71d-3a8e-48f1-9627-63f1528b9a48
            [catalog]=0e59f903-6bd8-4c3e-8792-34ea7479c13c
            [payments]=1d2455ac-05cd-436b-a39d-3f07392713f3
            [members]=aa282801-ffba-477c-af6d-394b2f4f9af9
            [messaging]=93fb9f5c-3d08-43da-a3cb-4c0207bd2ee0
            [funnel]=a617f2d2-6a58-46a2-8669-2eaf192712f0
            [admin]=e00eca0b-5323-4424-9b58-fdb073cfce82
            [community]=9df1b493-4cea-4b36-bec8-7299f054c17d
            [community-kids]=fc8a1b29-ac14-4dc9-a7b3-03d497b8bf4f
            [hub]=00b27b18-0587-460b-ba90-b6b24c423e45
            [fiscal]=2ea11afd-bdfd-4736-b400-c3db13fd8a0e
            [marketing]=7b8a87e6-a92f-4a5c-adc1-c4d2fe23b737
            [marketing-app]=95f3752d-95f7-45ab-a52a-19aa126d77ab
            [referrals]=1ad1c5ce-977c-4d7d-95a4-b8b08f2dc258
          )
          [ -n "${HELPDESK_SERVICE_ID:-}" ] && SVC_ID[helpdesk]="$HELPDESK_SERVICE_ID"
          [ -n "${HELPDESK_APP_SERVICE_ID:-}" ] && SVC_ID[helpdesk-app]="$HELPDESK_APP_SERVICE_ID"

          # environmentId de production resolvido POR NOME (sem hardcode).
          Q=$(jq -nc --arg pid "$PROJECT_ID" '{query:"query($pid:String!){environments(projectId:$pid){edges{node{id name}}}}",variables:{pid:$pid}}')
          ENV_ID=$(gql "$Q" | jq -r '.data.environments.edges[].node | select(.name=="production") | .id')
          if [ -z "$ENV_ID" ]; then echo "::error::environment production não encontrado"; exit 1; fi
          echo "environment production: $ENV_ID"

          # sha atual da MAIN (o dispatch pode rodar de qualquer ref).
          SHA=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r '.sha')
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then echo "::error::não resolvi o sha da main"; exit 1; fi
          echo "sha da main: $SHA"
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$SHA" != "$EXPECTED_SHA" ]; then
            echo '::error::main difere do SHA aprovado; nenhum deploy foi disparado'; exit 1
          fi

          declare -A WANT=()
          if [ -z "$FORCED" ] || [ "$FORCED" = 'all' ]; then
            echo '::error::selecione os serviços explicitamente por onda'; exit 1
          else
            IFS=',' read -ra REQ <<< "$FORCED"
            for s in "${REQ[@]}"; do
              s="$(echo "$s" | xargs)"
              [ -n "${SVC_ID[$s]:-}" ] && WANT[$s]=1 || { echo "::error::serviço desconhecido: $s"; exit 1; }
            done
          fi

          # Gate de segurança: só redeploya quem JÁ tem deployment em produção.
          declare -A DEP=()
          jq -n --arg sha "$SHA" --arg environment "$ENV_ID" '{expectedSha:$sha,environmentId:$environment,before:{},after:{}}' > production-manifest.json
          # Validar TODOS os serviços antes da primeira mutação. Um último deployment
          # SKIPPED não substitui o deployment efetivamente ativo.
          for s in "${!WANT[@]}"; do
            DQ=$(jq -nc --arg sid "${SVC_ID[$s]}" --arg eid "$ENV_ID" \
              '{query:"query($sid:String!,$eid:String!){serviceInstance(serviceId:$sid,environmentId:$eid){activeDeployments{id status meta}}}",variables:{sid:$sid,eid:$eid}}')
            BEFORE=$(gql "$DQ" | jq '.data.serviceInstance.activeDeployments')
            [ "$(echo "$BEFORE" | jq '[.[] | select(.status=="SUCCESS")] | length')" -ge 1 ] || { echo "::error::$s não tem deployment ativo saudável"; exit 1; }
            jq --arg service "$s" --argjson before "$BEFORE" '.before[$service]=$before' production-manifest.json > manifest.tmp
            mv manifest.tmp production-manifest.json
          done
          for s in "${!WANT[@]}"; do
            BODY=$(jq -nc --arg sid "${SVC_ID[$s]}" --arg eid "$ENV_ID" --arg sha "$SHA" \
              '{query:"mutation($s:String!,$e:String!,$c:String){serviceInstanceDeployV2(serviceId:$s,environmentId:$e,commitSha:$c)}",variables:{s:$sid,e:$eid,c:$sha}}')
            RESP=$(gql "$BODY")
            ID=$(echo "$RESP" | jq -r '.data.serviceInstanceDeployV2 // empty')
            if [ -z "$ID" ]; then echo "::error::deploy de $s falhou ao disparar: $(echo "$RESP" | jq -c '.errors // .')"; exit 1; fi
            DEP[$s]="$ID"
            jq --arg service "$s" --arg id "$ID" '.after[$service]={id:$id,status:"REQUESTED"}' production-manifest.json > manifest.tmp
            mv manifest.tmp production-manifest.json
            echo "  $s → deployment $ID"
          done

          if [ "${#DEP[@]}" -eq 0 ]; then echo "nenhum serviço a deployar"; exit 0; fi

          # Espera todos chegarem a estado terminal (healthcheck gateia o SUCCESS).
          FAIL=0; PENDING=1
          for i in $(seq 1 90); do
            sleep 20
            PENDING=0; LINE=""
            for s in "${!DEP[@]}"; do
              Q=$(jq -nc --arg id "${DEP[$s]}" '{query:"query($id:String!){deployment(id:$id){id status meta}}",variables:{id:$id}}')
              CURRENT=$(gql "$Q" | jq '.data.deployment')
              ST=$(echo "$CURRENT" | jq -r '.status // "?"')
              jq --arg service "$s" --argjson current "$CURRENT" '.after[$service]=$current' production-manifest.json > manifest.tmp
              mv manifest.tmp production-manifest.json
              LINE="$LINE $s=$ST"
              case "$ST" in
                SUCCESS)
                  [ "$(echo "$CURRENT" | jq -r '.meta.commitHash')" = "$EXPECTED_SHA" ] || { echo "::error::$s está em SHA divergente"; FAIL=1; }
                  ;;
                FAILED|CRASHED|REMOVED|SKIPPED|CANCELED|CANCELLED) FAIL=1 ;;
                *) PENDING=1 ;;
              esac
            done
            echo "[$i]$LINE"
            [ "$PENDING" -eq 0 ] && break
          done
          if [ "$FAIL" -eq 1 ] || [ "$PENDING" -eq 1 ]; then echo "::error::deploy de produção não convergiu"; exit 1; fi
          for s in "${!DEP[@]}"; do
            Q=$(jq -nc --arg sid "${SVC_ID[$s]}" --arg eid "$ENV_ID" '{query:"query($sid:String!,$eid:String!){serviceInstance(serviceId:$sid,environmentId:$eid){activeDeployments{id status meta}}}",variables:{sid:$sid,eid:$eid}}')
            ACTIVE=$(gql "$Q" | jq '.data.serviceInstance.activeDeployments')
            echo "$ACTIVE" | jq -e --arg id "${DEP[$s]}" --arg sha "$EXPECTED_SHA" 'any(.[]; .id==$id and .status=="SUCCESS" and .meta.commitHash==$sha)' >/dev/null || { echo "::error::$s não ativou o deployment esperado"; exit 1; }
            jq --arg service "$s" --argjson active "$ACTIVE" '.after[$service].activeDeployments=$active' production-manifest.json > manifest.tmp
            mv manifest.tmp production-manifest.json
          done
          echo "produção atualizada ✅"
      - name: Guardar manifesto da onda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-wave-${{ github.run_id }}
          path: production-manifest.json
          if-no-files-found: ignore
          retention-days: 30
