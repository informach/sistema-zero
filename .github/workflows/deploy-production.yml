name: Diagnóstico readonly de produção
on:
  workflow_dispatch:
    inputs:
      services:
        required: false
      expected_sha:
        required: false
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/ops/production-readonly-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-railway
      - name: Conferir somente transporte, triggers e política publicada
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
          RAILWAY_SSH_KNOWN_HOSTS: ${{ secrets.RAILWAY_SSH_KNOWN_HOSTS }}
          RAILWAY_PROJECT_ID: 415d5a1c-5f75-432c-8445-b395d0977ce3
          RAILWAY_ENVIRONMENT_ID: 19c212a5-85c0-493c-9630-a7a0569e8412
          HELPDESK_SERVICE_ID: ${{ vars.RAILWAY_HELPDESK_SERVICE_ID }}
          HELPDESK_APP_SERVICE_ID: ${{ vars.RAILWAY_HELPDESK_APP_SERVICE_ID }}
          LIVE_RECORDER_SERVICE_ID: ${{ vars.RAILWAY_LIVE_RECORDER_SERVICE_ID }}
        run: node scripts/ci/production-readonly-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readonly-diagnostic-${{ github.run_id }}
          path: production-readonly-diagnostic.json
          if-no-files-found: error
          retention-days: 7
