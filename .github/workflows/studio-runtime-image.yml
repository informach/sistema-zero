name: Qualificar imagem Linux de staging do studio-runtime

# Decisão da dona (21/11/2026): a qualificação da imagem do studio-runtime roda na staging, e não
# mais no branch próprio da frente do Pinta (`pinta-runtime-image-20261119.yml`, de onde este
# workflow foi copiado sem mudar os passos). A fonte é o próprio commit do push: cada mudança no
# motor dos cenários ou no core do Estúdio que muda o perfil de validação pede uma imagem nova.
# O artefato leva a imagem salva, o perfil, o SHA da fonte e a distribuição Python hermética;
# nenhuma credencial de implantação é usada aqui.
on:
  push:
    branches: ['staging']
    paths: ['.github/workflows/studio-runtime-image.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.sha }}
      STUDIO_PYTHON_TEST_CACHE: ${{ github.workspace }}/.cache/studio-python-runtime
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir fonte e instalar dependências
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bun install --frozen-lockfile
      - name: Conferir SDKs gerados sem alterar seus bytes
        run: bun run --cwd packages/studio check:scene3d-runtime
      - name: Conferir perfil e construir imagem sem credenciais de implantação
        working-directory: packages/studio-runtime
        run: bun run build:image
      - name: Executar contratos reais na imagem
        working-directory: packages/studio-runtime
        run: |
          bun tests/image-smoke.ts
          bun tests/validation-smoke.ts
      - name: Preparar distribuição hermética para os ensaios nativos
        run: bun packages/studio/scripts/build-python-runtime.ts
      - name: Executar Python e Three reais sem rede externa
        run: |
          bun packages/studio-runtime/tests/python-mission-smoke.ts
          bun packages/studio-runtime/tests/python-playtest-smoke.ts --docker --health
          bun packages/studio-runtime/tests/three-objectives-smoke.ts
      - name: Empacotar somente a imagem qualificada e seus recibos
        run: |
          set -euo pipefail
          mkdir -p .cache/studio-runtime-image
          docker image save sistemazero-studio-runtime:verify | gzip -1 > .cache/studio-runtime-image/runtime-image.tar.gz
          sha256sum .cache/studio-runtime-image/runtime-image.tar.gz > .cache/studio-runtime-image/SHA256SUMS
          cp packages/studio-runtime/runtime/validation-profile.json .cache/studio-runtime-image/validation-profile.json
          printf '%s\n' "$SOURCE_SHA" > .cache/studio-runtime-image/source-sha.txt
          docker image inspect sistemazero-studio-runtime:verify --format '{{.Id}}' > .cache/studio-runtime-image/image-id.txt
          node --input-type=module <<'NODE'
          import { readdirSync, cpSync, writeFileSync } from 'node:fs'
          const base = '.cache/studio-python-runtime/distributions'
          const candidates = readdirSync(base, { withFileTypes: true }).filter(entry => entry.isDirectory() && /^[a-f0-9]{64}$/.test(entry.name))
          if (candidates.length !== 1) throw new Error('Expected the exact qualified Python distribution')
          const hash = candidates[0].name
          cpSync(`${base}/${hash}`, `.cache/studio-runtime-image/python/${hash}`, { recursive: true, force: false, errorOnExist: true })
          writeFileSync('.cache/studio-runtime-image/python-distribution-sha.txt', `${hash}\n`, { flag: 'wx' })
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: studio-runtime-image-${{ github.sha }}
          path: .cache/studio-runtime-image/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
