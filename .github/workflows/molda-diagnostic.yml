# Diagnostic branch only. Never merge this workflow into staging.
name: Molda rendering diagnostics
on:
  push:
    branches: [diag/molda-project-import-tail-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  molda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Install browser engines
        working-directory: packages/molda
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Check Molda types
        working-directory: packages/molda
        run: bun run typecheck
      - name: Test plane contracts
        working-directory: packages/molda
        run: bun test src/scene/plane.test.ts src/scene/placement.test.ts src/viewport/SceneSelectionOutline.test.ts src/viewport/SceneComponentOverlay.test.ts
      - name: Verify selection, edges and plane in all browser engines
        working-directory: packages/molda
        run: bunx playwright test e2e/duplicate-selection.spec.ts e2e/plane.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molda-rendering-diagnostics
          path: packages/molda/.cache/playwright-results
