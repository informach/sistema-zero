{name: Supplemental Linux remaining gates,"on": {push: {branches: [qa/linux-remaining-gates-20261025]}},permissions: {contents: read},concurrency: {group: qa-linux-remaining-gates,cancel-in-progress: false},jobs: {verify: {name: "Supplemental Linux kits, DB and types",runs-on: ubuntu-latest,timeout-minutes: 40,services: {marketing-postgres: {image: postgres:16,env: {POSTGRES_PASSWORD: postgres,POSTGRES_DB: marketing_review},ports: [15439:5432],options: "--health-cmd \"pg_isready -U postgres -d marketing_review\" --health-interval 10s --health-timeout 5s --health-retries 5"},engagement-postgres: {image: postgres:16,env: {POSTGRES_PASSWORD: postgres,POSTGRES_DB: marketing_review},ports: [15465:5432],options: "--health-cmd \"pg_isready -U postgres -d marketing_review\" --health-interval 10s --health-timeout 5s --health-retries 5"},fiscal-postgres: {image: postgres:16,env: {POSTGRES_PASSWORD: postgres,POSTGRES_DB: sistemazero},ports: [55432:5432],options: "--health-cmd \"pg_isready -U postgres -d sistemazero\" --health-interval 10s --health-timeout 5s --health-retries 5"}},steps: [{uses: actions/checkout@v5},{uses: oven-sh/setup-bun@v2,with: {bun-version: 1.3.11}},{uses: actions/setup-node@v4,with: {node-version: "24"}},{name: Preparar fontes Ubuntu assinadas antes das instalações,run: "sudo \"$(command -v bun)\" --no-env-file scripts/ci/configure-ubuntu-apt.mjs"},{name: Instalar dependências (lockfile congelado),run: bun install --frozen-lockfile},{name: Verificar tipos do promotor operacional Python,run: bun run --cwd packages/studio-runtime typecheck:promoter},{name: Verificar barreira de manutenção,run: bun test scripts/release scripts/ci},{name: Auditar dependências da imagem do Studio Pro,working-directory: packages/studio-runtime,run: bun run audit:image},{name: Construir imagem do Studio Pro,working-directory: packages/studio-runtime,run: bun run build:image},{name: Lint (biome ci),run: bun run ci},{name: Validate local Python qualification contracts,run: "bun --no-env-file test ./scripts/local-studio-stack/isolation.test.ts ./scripts/local-studio-stack/python-input.test.ts ./experiments/studio-python-runtime/qualification/space_arena.test.ts\npython3 -B -m unittest discover -s experiments/studio-python-runtime/qualification -p input_presentation_test.py\n"},{name: Validate Python performance and reproduction instruments,working-directory: packages/studio,run: bun --no-env-file test ./scripts/python/reproduction.test.ts ./e2e-runtime/performanceAcceptance.test.ts ./e2e-runtime/gamePerformance.test.ts ./e2e-python-editor/f1AcceptanceReporter.test.ts},{name: Preparar e verificar biblioteca padrão Python hermética,env: {STUDIO_PYTHON_BUILD_TEST_VENDOR_DIRECTORY: .cache/studio-python-runtime/vendor},run: "bun packages/studio/scripts/build-python-runtime.ts\nbun test ./packages/studio/scripts/python/prepare-stdlib.test.ts\nbun test ./packages/studio/scripts/python/provided-modules.test.ts\n"},{name: Preservar evidências dos objetivos Python e 3D,if: always(),uses: actions/upload-artifact@v4,with: {name: python-project-mission-evidence,retention-days: 7,if-no-files-found: ignore,path: ".cache/studio-python-runtime/playtest-docker/**/native-output.json\n.cache/studio-python-runtime/playtest-docker/**/python-playtest-result.json\n.cache/studio-python-runtime/playtest-docker/**/cleanup.json\n.cache/studio-python-runtime/mission-docker/**/process.json\n.cache/studio-python-runtime/mission-docker/**/judge.json\n.cache/studio-python-runtime/mission-docker/**/cleanup.json\n.cache/studio-python-runtime/mission-docker/**/python-mission-options.json\n.cache/studio-python-runtime/mission-docker/**/python-mission-result.json\n.cache/studio-python-runtime/three-objectives/**/summary.json\n.cache/studio-python-runtime/three-objectives/**/cleanup.json\n.cache/studio-python-runtime/three-objectives/**/scene.jpg\n"}},{name: Preparar testes de mídia das oficinas,working-directory: packages/live-recorder,run: "sudo apt-get update\n# Speech models and GPU driver recommendations are not used by these tests.\nsudo apt-get install -y --no-install-recommends ffmpeg\nbunx playwright install --with-deps chromium\n# Ubuntu 24 restringe user namespaces de binários fora dos perfis do sistema.\n# Autorizar somente o Chromium instalado pelo Playwright mantém seu sandbox ativo.\nsudo tee /etc/apparmor.d/sistemazero-playwright >/dev/null <<EOF\nabi <abi/4.0>,\ninclude <tunables/global>\nprofile sistemazero-playwright \"$HOME/.cache/ms-playwright/**/chrome\" flags=(unconfined) {\n  userns,\n}\nprofile sistemazero-playwright-headless \"$HOME/.cache/ms-playwright/**/chrome-headless-shell\" flags=(unconfined) {\n  userns,\n}\nEOF\nsudo apparmor_parser -r /etc/apparmor.d/sistemazero-playwright\n"},{name: Verificar transporte do runtime do gravador,working-directory: packages/live-recorder,run: "# O gravador precisa do handshake Playwright corrigido no Bun 1.4.\n# O restante do monorepo conserva seu runtime de testes atual.\nnpm install --prefix \"$RUNNER_TEMP/live-recorder-runtime\" --no-audit --no-fund bun@1.4.3\nLIVE_RECORDER_BUN=\"$RUNNER_TEMP/live-recorder-runtime/node_modules/.bin/bun\" bun run test:transport\n"},{name: Preparar navegadores das provas de persistência do Studio,working-directory: packages/studio,run: bunx playwright install --with-deps chromium},{name: Instalar o compilador confiável para as provas fora da imagem,run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/studio-runtime/runtime},{name: Preparar o Chromium exato do executor Pro fora da imagem,run: node packages/studio-runtime/runtime/node_modules/playwright-core/cli.js install --with-deps chromium --only-shell},{name: Verificar IR gerada dos exemplos 3D,working-directory: packages/studio,run: "bun run check:game-3d-examples\nbun run check:world-3d-examples\n"},{name: "Verificar fontes, regras e exports dos kits de jogos",working-directory: packages/studio,run: "bun run check:pro-kits\nbun run check:pro-typescript-libs\nbun run check:python-text-sources\nbun run check:python-visual-examples\nbun run check:pgzero-games\nbun run check:raylib-games\nbun --no-env-file test ./scripts/python/reference-game-audio.test.ts ./scripts/python/generate-visual-example-block-metadata.test.ts ./scripts/python/pgzero-art-png.test.ts\nbun run test:canvas-survival\nbun run test:grid-games\nbun run verify:canvas-export\nbun run verify:grid-export\n"},{name: Alcance dos testes do Community Kids,working-directory: packages/community-kids,run: bun run test:reachability},{name: Manifestos das aulas interativas,run: "bun docs/aulas-interativas-tecnico/qa/validar-manifestos.ts\n"},{name: Falas ElevenLabs atualizadas,run: bun docs/aulas-interativas-tecnico/qa/gerar-falas-elevenlabs.ts --check},{name: Roteiros das aulas interativas,run: python3 docs/aulas-interativas-tecnico/validar-roteiros.py},{name: Testes dos cursos e guardas de vocabulário,run: bun test docs/aulas-interativas-tecnico/qa},{name: Tutoriais do Como Fazer,run: bun docs/como-fazer/validar.ts},{name: Testes DB fiscal (Postgres real),run: cd packages/fiscal && bun test tests/db,env: {TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sistemazero}},{name: Criar bancos descartáveis de Payments e Messaging,run: "PGPASSWORD=postgres psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE payments_financial_ci\"\nPGPASSWORD=postgres psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE messaging_recovery_ci_test\"\n"},{name: Testes DB payments (Postgres real),working-directory: packages/payments,run: bun test tests/db,env: {TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/payments_financial_ci}},{name: Testes DB messaging (Postgres real),working-directory: packages/messaging,run: bun test tests/db,env: {TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/messaging_recovery_ci_test}},{name: Criar banco descartável para upgrade das aulas,run: "PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE sz_aulas_qa_ci\""},{name: Criar banco descartável para ledger e revisões do Studio,run: "PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE studio_pro_review\""},{name: Criar banco descartável para entregas e builder Python,run: "PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE sz_gallery_qa_ci\""},{name: Criar banco descartável para a migração de linguagem do Zappy,run: "PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE studio_test_zappy_135\""},{name: Entregas e autorizações Python com PostgreSQL real,working-directory: packages/members,run: "# A primeira prova aplica o histórico real antes das provas do builder.\nbun test ./tests/db/gallery-copy.repository.test.ts\nbun test ./tests/db/python-builder-authorization.test.ts\nbun test ./tests/integration/python-builder-ack.test.ts\n",env: {GALLERY_QA_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sz_gallery_qa_ci,STUDIO_BUILDER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sz_gallery_qa_ci}},{name: Testes DB members (Postgres real),run: cd packages/members && bun test tests/db,env: {TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sistemazero,PENSA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/pensa_ci,LEARNING_QA_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sz_aulas_qa_ci,STUDIO_REVIEW_DATABASE_URL: postgres://postgres:postgres@localhost:55432/studio_pro_review,STUDIO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/studio_test_ci,ZAPPY_QA_DATABASE_URL: postgres://postgres:postgres@localhost:55432/studio_test_zappy_135,KIDS_JOURNEY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/kids_journey_ci,KIDS_JOURNEY_PURGE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/kids_journey_purge_ci}},{name: Pensa integrado com API e PostgreSQL reais,working-directory: packages/pensa,run: "bun run typecheck:e2e\nbun run e2e:native\n",env: {PENSA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/pensa_ci}},{name: Testes DB referrals (Postgres real),run: cd packages/referrals && bun test tests/db,env: {TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sistemazero}},{name: Criar banco descartável do Helpdesk,run: "PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE helpdesk_test\""},{name: Testes DB helpdesk (Postgres real),working-directory: packages/helpdesk,run: "bun run db:migrate\nbun test tests/integration/drizzle-*.test.ts\n",env: {DATABASE_URL: postgres://postgres:postgres@localhost:55432/helpdesk_test,HELPDESK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/helpdesk_test}},{name: Testes DB marketing (Postgres real),run: "cd packages/marketing\nbun run db:migrate\nbun test tests/*.postgres.test.ts\n",env: {DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review,MARKETING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review,ENGAGEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15465/marketing_review}},{name: Criar banco isolado das sessões de autenticação,run: "PGPASSWORD=postgres psql -h 127.0.0.1 -p 15439 -U postgres -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE marketing_review_tests\""},{name: "Testes DB auth, sessões desktop e navegador (Postgres real)",working-directory: packages/auth,run: "bun run db:migrate\nbun test tests/db\n",env: {DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review_tests,MARKETING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review_tests,TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review_tests,PROFILE_ADMISSION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/kids_journey_auth_admission_ci}},{name: Typecheck (todos os pacotes),run: "bun run --filter '*' typecheck"},{name: Evidências do Pensa integrado,if: failure(),uses: actions/upload-artifact@v4,with: {name: pensa-native-failure,path: packages/pensa/.cache/playwright-native-results,if-no-files-found: ignore}}]}}}