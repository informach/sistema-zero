name: Studio preview DPR diagnostics

# Diagnóstico manual (21/11/2026): desde o Playwright 1.65.1 (Chromium 159), no Linux, a prévia do
# Reino Zero no celular emulado (390×844, deviceScaleFactor 3) abre com o documento do jogo
# dividido pelo DPR (130×207 em vez de 390×622), e os controles de toque saem da camada. No
# Windows, o mesmo Chromium 159 mede certo. Este workflow roda a MESMA spec com o Chromium sem
# interface padrão (headless shell) e com o Chromium completo, para separar defeito da emulação
# de defeito do produto. Não muda nenhum teste nem a suíte.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dpr:
    strategy:
      fail-fast: false
      matrix:
        browser: [headless-shell, full-chromium]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare signed Ubuntu sources
        run: sudo "$(command -v bun)" --no-env-file scripts/ci/configure-ubuntu-apt.mjs
      - run: bun install --frozen-lockfile
      - working-directory: packages/studio
        run: bunx playwright install --with-deps chromium
      - name: Select full Chromium
        if: matrix.browser == 'full-chromium'
        working-directory: packages/studio
        run: node -e "const p=require('playwright-core').chromium.executablePath();require('node:fs').appendFileSync(process.env.GITHUB_ENV,'PW_CHROMIUM='+p+'\n')"
      - name: Reino Zero mobile controls
        working-directory: packages/studio
        run: bunx playwright test e2e/reino-zero.spec.ts --project=chromium --grep 'controles móveis' --repeat-each=3 --retries=0 --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-preview-dpr-${{ matrix.browser }}
          path: packages/studio/.cache/playwright-results
          if-no-files-found: ignore
