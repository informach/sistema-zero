# Executa em todo push de main: Wait for CI precisa de um workflow sem filtro
# de paths. Não cancelar runs: a configuração é pré-requisito do deploy nativo.
name: Configuração Railway

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  plan:
    name: railway-config-plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-railway
      - name: Planejar configuração de produção
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/ci/railway-config.mjs plan production "$RUNNER_TEMP/railway-production-plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: railway-production-plan-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/railway-production-plan.json
          retention-days: 14
          if-no-files-found: error

  apply:
    name: railway-config-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-railway
      - name: Localizar plano do PR promovido
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...repo, commit_sha: context.sha });
            const pr = prs.find(p => p.merged_at && p.merge_commit_sha === context.sha && p.base.ref === 'main' && p.head.repo?.full_name === process.env.GITHUB_REPOSITORY);
            if (!pr) throw new Error('O commit de main precisa vir de um PR com plano aprovado');
            const name = `railway-production-plan-${pr.head.sha}`;
            const { data } = await github.rest.actions.listArtifactsForRepo({ ...repo, name, per_page: 100 });
            const candidates = data.artifacts.filter(a => !a.expired && a.workflow_run?.head_sha === pr.head.sha);
            let artifact;
            for (const candidate of candidates) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: candidate.workflow_run.id });
              if (run.path === '.github/workflows/railway-config.yml' && run.event === 'pull_request' && run.conclusion === 'success') {
                artifact = candidate;
                break;
              }
            }
            if (!artifact) throw new Error('Plano validado não encontrado para o SHA promovido');
            core.setOutput('id', artifact.id);
            core.setOutput('run', artifact.workflow_run.id);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.plan.outputs.id }}
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/railway-plan
          merge-multiple: true
      - name: Aplicar exatamente o plano validado
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/ci/railway-config.mjs apply production "$RUNNER_TEMP/railway-plan/railway-production-plan.json"
