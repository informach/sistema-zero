name: Python executor resource qualification

on:
  push:
    branches: [qa/python-resource-measurement-20261025]

permissions:
  contents: read

concurrency:
  group: python-resource-qualification
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare signed Ubuntu package sources
        run: sudo "$(command -v bun)" --no-env-file scripts/ci/configure-ubuntu-apt.mjs
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build the canonical production image
        working-directory: packages/studio-runtime
        run: bun run build:image
      - name: Measure unchanged protected scenarios
        timeout-minutes: 8
        env:
          STUDIO_PYTHON_TEST_CACHE: ${{ github.workspace }}/.cache/python-resource-qualification
        run: bun packages/studio-runtime/tests/python-mission-smoke.ts
      - name: Check complete measurements and cleanup
        run: node scripts/qa/summarize-python-resources.mjs .cache/python-resource-qualification/mission-docker
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-resource-evidence-${{ github.sha }}
          path: |
            .cache/python-resource-qualification/mission-docker/summary.json
            .cache/python-resource-qualification/mission-docker/**/resource-usage.json
            .cache/python-resource-qualification/mission-docker/**/judge.json
            .cache/python-resource-qualification/mission-docker/**/cleanup.json
            .cache/python-resource-qualification/mission-docker/**/process.json
          if-no-files-found: error
          retention-days: 14
