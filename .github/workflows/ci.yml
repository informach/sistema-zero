name: Diagnostico readonly de producao
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: e0d5b0a71194f9486e3ce7a9a62e0aa8270afbb7
      - uses: ./.github/actions/setup-railway
      - name: Conferir leituras sem publicar servicos
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
          RAILWAY_SSH_KNOWN_HOSTS: ${{ secrets.RAILWAY_SSH_KNOWN_HOSTS }}
          RAILWAY_PROJECT_ID: 415d5a1c-5f75-432c-8445-b395d0977ce3
          RAILWAY_ENVIRONMENT_ID: 19c212a5-85c0-493c-9630-a7a0569e8412
          HELPDESK_SERVICE_ID: ${{ vars.RAILWAY_HELPDESK_SERVICE_ID }}
          HELPDESK_APP_SERVICE_ID: ${{ vars.RAILWAY_HELPDESK_APP_SERVICE_ID }}
          LIVE_RECORDER_SERVICE_ID: ${{ vars.RAILWAY_LIVE_RECORDER_SERVICE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {resolveProductionSource} from './scripts/ci/production-release.mjs'
          import {createRailwayPorts,prepareSsh,describeKidsJourneyRolloutFailure} from './scripts/ci/kids-journey-rollout.mjs'
          import {productionApplicationIds} from './scripts/release/kids-journey-targets.mjs'
          const sha='027f895b8a67300a4bae28f86423953893a1a289'
          const knownMessages=new Set(['Not Authorized','Unauthorized','Forbidden','Rate limit exceeded','Too Many Requests'])
          const network=async(url,init)=>{
            let r
            try{r=await fetch(url,init)}catch(e){console.log(JSON.stringify({transport:new URL(url).hostname,networkFailure:true,errorType:e?.name}));throw e}
            let errors=[]
            if(new URL(url).hostname==='backboard.railway.com'){
              try{const body=await r.clone().json();errors=Array.isArray(body.errors)?body.errors.map(e=>knownMessages.has(e.message)?e.message:'unclassified-provider-error'):[]}catch{}
            }
            console.log(JSON.stringify({transport:new URL(url).hostname,path:new URL(url).pathname,status:r.status,remaining:r.headers.get('x-ratelimit-remaining'),retryAfter:r.headers.get('retry-after'),errors}))
            return r
          }
          const get=async path=>{const r=await network('https://api.github.com/repos/informach/sistema-zero'+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'},signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('github-read-rejected');return r.json()}
          let phase='source',ssh
          try{
            const source=await resolveProductionSource(sha,get)
            console.log(JSON.stringify({phase,state:'passed',ci:source.ci}))
            phase='prepare-ssh';ssh=prepareSsh(process.env)
            const backend=createRailwayPorts(sha,process.env,ssh.identity,{target:'production',applications:true,fetch:network,log:e=>console.log(JSON.stringify(e))})
            const deadline=backend.now()+8*60000
            phase='native-initial';await backend.requireNativeDisabled(Object.keys(productionApplicationIds(process.env)),deadline);console.log(JSON.stringify({phase,state:'passed'}))
            phase='application-preflight';await backend.preflightApplications(['members','auth','admin','community','community-kids'],deadline,[]);console.log(JSON.stringify({phase,state:'passed'}))
            phase='backend-preflight';await backend.preflight(deadline);console.log(JSON.stringify({phase,state:'passed'}))
            phase='canonical-read';const canonical=await backend.remote('verify','active',{},deadline);console.log(JSON.stringify({phase,status:canonical.status,version:canonical.version}))
            phase='source-final';if((await get('/commits/main')).sha!==sha)throw Error('main-changed');console.log(JSON.stringify({phase,state:'passed'}))
            phase='native-final';await backend.requireNativeDisabled(Object.keys(productionApplicationIds(process.env)),deadline);console.log(JSON.stringify({phase,state:'passed',newDeployments:0}))
          }catch(e){console.log(JSON.stringify({phase,state:'failed',errorType:e?.name,knownReason:['github-read-rejected','main-changed'].includes(e?.message)?e.message:undefined,...describeKidsJourneyRolloutFailure(e)}));process.exitCode=1}finally{ssh?.dispose()}
          NODE
