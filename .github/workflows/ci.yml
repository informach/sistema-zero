# CI do monorepo: roda em TODO PR para a main (check obrigatório no ruleset
# `protege-main`) e em push na staging (canário — quebra aparece antes do PR).
# Sem Postgres de propósito: as suítes usam fakes; os tests/db do auth se
# auto-pulam sem banco (ficam verdes). Sem `.env` aqui — testes não podem
# depender de env local (handlers recebem tudo por deps).
#
# Push na STAGING também faz o DEPLOY do ambiente staging do Railway (job
# `deploy-staging`, depois do CI verde) — substitui o trigger nativo do Railway,
# que só pode ser armado pelo dashboard. Deploya SÓ os serviços afetados pelo
# diff (espelha os watchPatterns dos railway.json). `workflow_dispatch` permite
# forçar (`services: all` ou CSV — ex.: "funnel,auth").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      services:
        description: 'Serviços p/ deploy no staging: "all" ou CSV (ex.: funnel,auth)'
        required: false
        default: 'all'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Mesma minor do dev local — lockfile e comportamento de teste estáveis.
          bun-version: '1.3.11'

      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Lint (biome ci)
        run: bun run ci

      - name: Testes (todos os pacotes)
        run: bun run --filter '*' test

      - name: Typecheck (todos os pacotes)
        run: bun run --filter '*' typecheck

  deploy-staging:
    name: deploy-staging
    needs: ci
    # Só push na staging (ou dispatch manual) — PR para a main NUNCA deploya.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API: https://backboard.railway.com/graphql/v2
      STAGING_ENV_ID: f634cff6-aafb-4804-8b69-172fad4e946e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diff do range do push (multi-commit)

      - name: Calcular serviços afetados e deployar
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.inputs.services }}
        run: |
          set -euo pipefail

          # ids dos serviços no Railway (não são segredo)
          declare -A SVC_ID=(
            [api-gateway]=2b7748bc-d3e3-4aff-bd94-3f514b53c44f
            [auth]=8c57d71d-3a8e-48f1-9627-63f1528b9a48
            [catalog]=0e59f903-6bd8-4c3e-8792-34ea7479c13c
            [payments]=1d2455ac-05cd-436b-a39d-3f07392713f3
            [members]=aa282801-ffba-477c-af6d-394b2f4f9af9
            [messaging]=93fb9f5c-3d08-43da-a3cb-4c0207bd2ee0
            [funnel]=a617f2d2-6a58-46a2-8669-2eaf192712f0
            [admin]=e00eca0b-5323-4424-9b58-fdb073cfce82
            [community]=9df1b493-4cea-4b36-bec8-7299f054c17d
          )

          declare -A WANT=()
          add() { WANT[$1]=1; }
          add_all() { for s in "${!SVC_ID[@]}"; do add "$s"; done; }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${FORCED:-all}" = "all" ]; then add_all; else
              IFS=',' read -ra REQ <<< "$FORCED"
              for s in "${REQ[@]}"; do
                s="$(echo "$s" | xargs)"
                [ -n "${SVC_ID[$s]:-}" ] && add "$s" || { echo "serviço desconhecido: $s"; exit 1; }
              done
            fi
          else
            # range do push; branch nova/força → deploya tudo (não dá pra saber o diff)
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "range indisponível — deployando tudo"
              add_all
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
              echo "arquivos alterados:"; echo "$CHANGED"
              # espelha os watchPatterns dos railway.json
              while IFS= read -r f; do
                case "$f" in
                  bun.lock|package.json|.dockerignore) add_all ;;
                  railway.json) add payments ;; # o railway.json da RAIZ é do payments
                  packages/core/*) for s in api-gateway auth catalog payments members messaging funnel; do add "$s"; done ;;
                  packages/ui/*) add admin; add community; add funnel ;;
                  packages/api-gateway/*) add api-gateway ;;
                  packages/auth/*) add auth ;;
                  packages/catalog/*) add catalog ;;
                  packages/payments/*) add payments ;;
                  packages/members/*) add members ;;
                  packages/messaging/*) add messaging ;;
                  packages/funnel/*) add funnel ;;
                  packages/admin/*) add admin ;;
                  packages/community/*) add community ;;
                  packages/member-shell/*) add community ;; # BFF compartilhado; somar community-kids quando o serviço existir
                  packages/community-kids/*) ;; # serviço AINDA NÃO criado no Railway — criar (fluxo GraphQL do CLAUDE.md do kids), somar o id ao SVC_ID e trocar este no-op por `add community-kids`
                  packages/studio/*) ;; # lib interna (sem serviço deployado); quando um app a consumir, somar o consumer aqui
                esac
              done <<< "$CHANGED"
            fi
          fi

          if [ "${#WANT[@]}" -eq 0 ]; then
            echo "nenhum serviço afetado por este push — nada a deployar ✅"
            exit 0
          fi
          echo "deployando no staging: ${!WANT[*]} (sha $GITHUB_SHA)"

          gql() { curl -sS -X POST -H "Authorization: Bearer $RAILWAY_TOKEN" -H 'content-type: application/json' -d "$1" "$RAILWAY_API"; }

          declare -A DEP=()
          for s in "${!WANT[@]}"; do
            BODY=$(jq -nc --arg sid "${SVC_ID[$s]}" --arg eid "$STAGING_ENV_ID" --arg sha "$GITHUB_SHA" \
              '{query:"mutation($s:String!,$e:String!,$c:String){serviceInstanceDeployV2(serviceId:$s,environmentId:$e,commitSha:$c)}",variables:{s:$sid,e:$eid,c:$sha}}')
            RESP=$(gql "$BODY")
            ID=$(echo "$RESP" | jq -r '.data.serviceInstanceDeployV2 // empty')
            if [ -z "$ID" ]; then echo "::error::deploy de $s falhou ao disparar: $(echo "$RESP" | jq -c '.errors // .')"; exit 1; fi
            DEP[$s]="$ID"
            echo "  $s → deployment $ID"
          done

          # espera todos chegarem a estado terminal (healthcheck gateia o SUCCESS)
          FAIL=0
          for i in $(seq 1 60); do
            sleep 20
            PENDING=0; LINE=""
            for s in "${!DEP[@]}"; do
              Q=$(jq -nc --arg id "${DEP[$s]}" '{query:"query($id:String!){deployment(id:$id){status}}",variables:{id:$id}}')
              ST=$(gql "$Q" | jq -r '.data.deployment.status // "?"')
              LINE="$LINE $s=$ST"
              case "$ST" in
                SUCCESS) ;;
                FAILED|CRASHED|REMOVED) FAIL=1 ;;
                *) PENDING=1 ;;
              esac
            done
            echo "[$i]$LINE"
            [ "$PENDING" -eq 0 ] && break
          done
          if [ "$FAIL" -eq 1 ] || [ "$PENDING" -eq 1 ]; then echo "::error::deploy do staging não convergiu"; exit 1; fi
          echo "staging atualizado ✅"
