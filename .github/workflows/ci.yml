name: Molda staging Kids startup diagnostics

# Diagnostic branch only. Never merge this workflow into staging.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kids-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Show runtime and runner resources
        run: |
          node --version
          bun --version
          free -m
          df -h .
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: packages/community-kids
        run: bunx playwright install --with-deps chromium
      - name: Reproduce Kids startup with build stdout visible
        working-directory: packages/community-kids
        run: bun run e2e:smoke
      - name: Pensa browser workflows
        working-directory: packages/pensa
        run: bun run e2e
      - name: Extended and responsive Kids workflows
        working-directory: packages/community-kids
        run: bun run e2e:scenes
      - name: Publish Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molda-kids-startup-diagnostics
          path: |
            packages/community-kids/.cache/playwright-results
            packages/community-kids/.cache/scene-results
            packages/pensa/.cache/playwright-results
          retention-days: 7
