name: Read-only staging deployment diagnostics
on:
  workflow_dispatch:
    inputs:
      services:
        required: false
        default: diagnostics
      before_sha:
        required: false
permissions:
  contents: read
concurrency:
  group: staging-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-railway
      - name: Inspect current staging state without changes
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          node scripts/ci/staging-deployment-diagnostics.mjs
          node scripts/ci/railway-config.mjs plan staging "$RUNNER_TEMP/staging-read-only-plan.json"
