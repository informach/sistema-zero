name: Molda Kids CI diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: molda-kids-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG_PRINT_LIMIT: '50000'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - name: Isolated composer repetitions
        if: always()
        working-directory: packages/community-kids
        run: bun test tests/community-composers-a11y.test.tsx --rerun-each 100
      - name: Install comparison runtime
        if: always()
        run: npm install --prefix "$RUNNER_TEMP/bun-comparison" --no-audit --no-fund bun@1.4.3
      - name: Same composer assertions with Bun 1.4.3
        if: always()
        working-directory: packages/community-kids
        run: '"$RUNNER_TEMP/bun-comparison/node_modules/.bin/bun" test tests/community-composers-a11y.test.tsx --rerun-each 100'
      - name: Full Kids package with Bun 1.4.3
        if: always()
        working-directory: packages/community-kids
        run: '"$RUNNER_TEMP/bun-comparison/node_modules/.bin/bun" test tests'
