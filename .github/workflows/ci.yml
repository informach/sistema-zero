# CI do monorepo: roda em TODO PR para a main (check obrigatório no ruleset
# `protege-main`) e em push na staging (canário — quebra aparece antes do PR).
# O passo global roda sem a variável dos bancos descartáveis, então os tests/db
# usam passos explícitos no Postgres dedicado para provar invariantes críticas.
# O Studio executa a suíte Chromium completa em três shards contra build de
# produção, prova CSP/SRI também no Firefox e a gravação de saída (recarregar
# ou esconder a aba logo depois de uma mudança) no WebKit, o motor do iPad.
# Sem `.env` aqui — testes não podem depender de env local (handlers recebem tudo por deps).
#
# Push na STAGING também faz o DEPLOY do ambiente staging do Railway (job
# `deploy-staging`, depois do CI verde) — substitui o trigger nativo do Railway,
# que só pode ser armado pelo dashboard. Deploya SÓ os serviços afetados pelo
# diff (espelha .railway/services). `workflow_dispatch` permite
# forçar (`services: all` ou CSV — ex.: "funnel,auth").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      services:
        description: 'Serviços p/ deploy no staging: "all", "auto" com before_sha, ou CSV'
        required: false
        default: 'all'
      before_sha:
        description: 'SHA anterior de staging, obrigatório para services=auto'
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # Baseline CI 40129239034: 41m14s; as provas novas Python/3D acrescentam ~4m19s.
    # Dê margem ao job completo sem ampliar os deadlines individuais ou do produto.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      marketing-postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketing_review
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketing_review"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      engagement-postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketing_review
        ports:
          - 15465:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketing_review"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      fiscal-postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistemazero
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sistemazero"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Mesma minor do dev local — lockfile e comportamento de teste estáveis.
          bun-version: '1.3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preparar fontes Ubuntu assinadas antes das instalações
        run: sudo "$(command -v bun)" --no-env-file scripts/ci/configure-ubuntu-apt.mjs

      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Verificar tipos do promotor operacional Python
        run: bun run --cwd packages/studio-runtime typecheck:promoter

      - name: Verificar barreira de manutenção
        run: bun test scripts/release scripts/ci

      - name: Auditar dependências da imagem do Studio Pro
        working-directory: packages/studio-runtime
        run: bun run audit:image

      - name: Construir imagem do Studio Pro
        working-directory: packages/studio-runtime
        run: bun run build:image

      - name: Verificar imagem e objetivos dos kits no sandbox sem rede
        working-directory: packages/studio-runtime
        run: |
          bun tests/image-smoke.ts
          bun tests/validation-smoke.ts

      - name: Lint (biome ci)
        run: bun run ci

      # Studio's isolated unit runner intentionally discovers only src/. These QA
      # helpers live beside Playwright specs and local CLIs, so select them explicitly.
      - name: Validate local Python qualification contracts
        run: |
          bun --no-env-file test ./scripts/local-studio-stack/isolation.test.ts ./scripts/local-studio-stack/python-input.test.ts ./experiments/studio-python-runtime/qualification/space_arena.test.ts
          python3 -B -m unittest discover -s experiments/studio-python-runtime/qualification -p input_presentation_test.py

      - name: Validate Python performance and reproduction instruments
        working-directory: packages/studio
        run: bun --no-env-file test ./scripts/python/reproduction.test.ts ./e2e-runtime/performanceAcceptance.test.ts ./e2e-runtime/gamePerformance.test.ts ./e2e-python-editor/f1AcceptanceReporter.test.ts

      - name: Verificar cancelamento Python por RPC no runtime real
        working-directory: packages/studio-language-service
        run: bun run verify:rpc
        timeout-minutes: 2

      - name: Preparar e verificar biblioteca padrão Python hermética
        env:
          STUDIO_PYTHON_BUILD_TEST_VENDOR_DIRECTORY: .cache/studio-python-runtime/vendor
        run: |
          bun packages/studio/scripts/build-python-runtime.ts
          bun test ./packages/studio/scripts/python/prepare-stdlib.test.ts
          bun test ./packages/studio/scripts/python/provided-modules.test.ts

      - name: Provar objetivos Python com programas reais no sandbox sem rede
        timeout-minutes: 8
        env:
          STUDIO_PYTHON_TEST_CACHE: ${{ github.workspace }}/.cache/studio-python-runtime
        run: |
          bun packages/studio-runtime/tests/python-mission-smoke.ts
          bun packages/studio-runtime/tests/python-playtest-smoke.ts --docker --health

      - name: Provar objetivos Jogo 3D e three.js no sandbox sem rede
        timeout-minutes: 5
        env:
          STUDIO_PYTHON_TEST_CACHE: ${{ github.workspace }}/.cache/studio-python-runtime
        run: bun packages/studio-runtime/tests/three-objectives-smoke.ts

      - name: Preservar evidências dos objetivos Python e 3D
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-project-mission-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .cache/studio-python-runtime/playtest-docker/**/native-output.json
            .cache/studio-python-runtime/playtest-docker/**/python-playtest-result.json
            .cache/studio-python-runtime/playtest-docker/**/cleanup.json
            .cache/studio-python-runtime/mission-docker/**/process.json
            .cache/studio-python-runtime/mission-docker/**/judge.json
            .cache/studio-python-runtime/mission-docker/**/cleanup.json
            .cache/studio-python-runtime/mission-docker/**/python-mission-options.json
            .cache/studio-python-runtime/mission-docker/**/python-mission-result.json
            .cache/studio-python-runtime/three-objectives/**/summary.json
            .cache/studio-python-runtime/three-objectives/**/cleanup.json
            .cache/studio-python-runtime/three-objectives/**/scene.jpg

      - name: Preparar testes de mídia das oficinas
        working-directory: packages/live-recorder
        run: |
          sudo apt-get update
          # Speech models and GPU driver recommendations are not used by these tests.
          sudo apt-get install -y --no-install-recommends ffmpeg
          bunx playwright install --with-deps chromium
          # Ubuntu 24 restringe user namespaces de binários fora dos perfis do sistema.
          # Autorizar somente o Chromium instalado pelo Playwright mantém seu sandbox ativo.
          sudo tee /etc/apparmor.d/sistemazero-playwright >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile sistemazero-playwright "$HOME/.cache/ms-playwright/**/chrome" flags=(unconfined) {
            userns,
          }
          profile sistemazero-playwright-headless "$HOME/.cache/ms-playwright/**/chrome-headless-shell" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/sistemazero-playwright

      - name: Verificar transporte do runtime do gravador
        working-directory: packages/live-recorder
        run: |
          # O gravador precisa do handshake Playwright corrigido no Bun 1.4.
          # O restante do monorepo conserva seu runtime de testes atual.
          npm install --prefix "$RUNNER_TEMP/live-recorder-runtime" --no-audit --no-fund bun@1.4.3
          LIVE_RECORDER_BUN="$RUNNER_TEMP/live-recorder-runtime/node_modules/.bin/bun" bun run test:transport

      # O molda voltou a rodar aqui (10/09/2026). Ele passou um dia num job Windows porque o Bun
      # 1.3.11 segfaultava neste runner dentro de `SceneWorkshop.test.tsx`: `terminate()` num
      # Worker cujo módulo ainda transpilava no pool de threads (oven-sh/bun#33936, corrigido no
      # Bun 1.4.0). O conserto no código é o aperto de mão de `packages/molda/src/workers/
      # workerHandshake.ts` (nenhum worker é encerrado antes de anunciar que carregou).
      - name: Preparar navegadores das provas de persistência do Studio
        working-directory: packages/studio
        run: bunx playwright install --with-deps chromium

      - name: Instalar o compilador confiável para as provas fora da imagem
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/studio-runtime/runtime

      - name: Preparar o Chromium exato do executor Pro fora da imagem
        # Os exports usam o playwright-core fixado no runtime, que tem revisão
        # própria de Chromium; o browser do Studio/gravador não o substitui.
        run: node packages/studio-runtime/runtime/node_modules/playwright-core/cli.js install --with-deps chromium --only-shell

      # Credenciais e posse de portas do runtime são homologadas no Windows; o
      # FFmpeg empacotado do desktop também precisa de uma plataforma suportada.
      - name: Testes dos pacotes web e serviços
        run: node scripts/ci/test-service-packages.mjs

      - name: Testes do Studio com CPU disponível para os projetos grandes
        run: bun run --filter '@sistemazero/studio' test
        env:
          # WebKit roda com as mesmas asserções no job obrigatório studio-storage-macos.
          # WORKAROUND do port Linux: perde o journal no reload com CAS grande em voo;
          # macOS e Windows passaram o mesmo cenário (run 38838008325 / prova local).
          # macOS é a referência recomendada para Safari: playwright.dev/docs/browsers#webkit.
          STUDIO_STORAGE_BROWSER: chromium

      - name: Verificar IR gerada dos exemplos 3D
        working-directory: packages/studio
        run: |
          bun run check:game-3d-examples
          bun run check:world-3d-examples

      - name: Verificar fontes, regras e exports dos kits de jogos
        working-directory: packages/studio
        run: |
          bun run check:pro-kits
          bun run check:pro-typescript-libs
          bun run check:python-text-sources
          bun run check:python-visual-examples
          bun run check:pgzero-games
          bun run check:raylib-games
          bun --no-env-file test ./scripts/python/reference-game-audio.test.ts ./scripts/python/generate-visual-example-block-metadata.test.ts
          bun run test:canvas-survival
          bun run test:grid-games
          bun run verify:canvas-export
          bun run verify:grid-export

      # ⚠️ Este portão nunca rodou no CI: ele só era encadeado pelo `test:coverage` do
      # pacote, e o passo global chama `test`. Ele reprova quando um módulo declarado
      # crítico sai do grafo de import dos testes — o `bun test` verde não percebe isso.
      - name: Alcance dos testes do Community Kids
        working-directory: packages/community-kids
        run: bun run test:reachability

      # Valida os 37 manifestos comuns, versionados junto dos roteiros em
      # docs/aulas-interativas/<curso>.
      - name: Manifestos das aulas interativas
        run: |
          bun docs/aulas-interativas-tecnico/qa/validar-manifestos.ts


      - name: Falas ElevenLabs atualizadas
        run: bun docs/aulas-interativas-tecnico/qa/gerar-falas-elevenlabs.ts --check

      - name: Roteiros das aulas interativas
        run: python3 docs/aulas-interativas-tecnico/validar-roteiros.py

      # O `bun run --filter '*' test` só cobre packages/*: os testes dos cinco cursos e os guardas
      # do vocabulário comum (docs/aulas-interativas-tecnico/qa) nunca rodavam aqui (06/10/2026).
      # Não precisam de banco nem de navegador: leem os manifestos e montam os projetos com o
      # Blockly do Studio sobre o happy-dom.
      - name: Testes dos cursos e guardas de vocabulário
        run: bun test docs/aulas-interativas-tecnico/qa

      - name: Tutoriais do Como Fazer
        run: bun docs/como-fazer/validar.ts

      - name: Testes DB fiscal (Postgres real)
        run: cd packages/fiscal && bun test tests/db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sistemazero

      # O passo geral não fornece TEST_DATABASE_URL: sem estas etapas, as provas
      # financeiras de transação, concorrência e migrações seriam puladas.
      - name: Criar bancos descartáveis de Payments e Messaging
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE payments_financial_ci"
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE messaging_recovery_ci_test"

      - name: Testes DB payments (Postgres real)
        working-directory: packages/payments
        run: bun test tests/db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/payments_financial_ci

      - name: Testes DB messaging (Postgres real)
        working-directory: packages/messaging
        run: bun test tests/db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/messaging_recovery_ci_test

      # ⚠️ A pasta INTEIRA, como no fiscal acima. Até 15/08 esta linha apontava para UM
      # arquivo, então os outros 10 — justamente os documentados como "o único teste que
      # alcança este SQL", porque o fake in-memory o reimplementa em JS — nunca rodaram no
      # CI: eles PULAM sozinhos sem Postgres (`describe.skipIf`) e o passo verde do
      # `bun test` geral parecia cobri-los.
      - name: Criar banco descartável para upgrade das aulas
        run: PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE sz_aulas_qa_ci"

      - name: Criar banco descartável para ledger e revisões do Studio
        run: PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE studio_pro_review"

      - name: Criar banco descartável para entregas e builder Python
        run: PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE sz_gallery_qa_ci"

      - name: Criar banco descartável para a migração de linguagem do Zappy
        run: PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE studio_test_zappy_135"

      - name: Entregas e autorizações Python com PostgreSQL real
        working-directory: packages/members
        run: |
          # A primeira prova aplica o histórico real antes das provas do builder.
          bun test ./tests/db/gallery-copy.repository.test.ts
          bun test ./tests/db/python-builder-authorization.test.ts
          bun test ./tests/integration/python-builder-ack.test.ts
        env:
          GALLERY_QA_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sz_gallery_qa_ci
          STUDIO_BUILDER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sz_gallery_qa_ci

      - name: Testes DB members (Postgres real)
        run: cd packages/members && bun test tests/db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sistemazero
          PENSA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/pensa_ci
          LEARNING_QA_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sz_aulas_qa_ci
          STUDIO_REVIEW_DATABASE_URL: postgres://postgres:postgres@localhost:55432/studio_pro_review
          STUDIO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/studio_test_ci
          ZAPPY_QA_DATABASE_URL: postgres://postgres:postgres@localhost:55432/studio_test_zappy_135
          KIDS_JOURNEY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/kids_journey_ci
          KIDS_JOURNEY_PURGE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/kids_journey_purge_ci

      - name: Pensa integrado com API e PostgreSQL reais
        working-directory: packages/pensa
        run: |
          bun run typecheck:e2e
          bun run e2e:native
        env:
          PENSA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/pensa_ci

      - name: Testes DB referrals (Postgres real)
        run: cd packages/referrals && bun test tests/db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/sistemazero

      - name: Criar banco descartável do Helpdesk
        run: PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE helpdesk_test"

      - name: Testes DB helpdesk (Postgres real)
        working-directory: packages/helpdesk
        run: |
          bun run db:migrate
          bun test tests/integration/drizzle-*.test.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:55432/helpdesk_test
          HELPDESK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/helpdesk_test

      - name: Testes DB marketing (Postgres real)
        run: |
          cd packages/marketing
          bun run db:migrate
          bun test tests/*.postgres.test.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review
          MARKETING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review
          ENGAGEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15465/marketing_review

      - name: Criar banco isolado das sessões de autenticação
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 15439 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE marketing_review_tests"

      - name: Testes DB auth, sessões desktop e navegador (Postgres real)
        working-directory: packages/auth
        run: |
          bun run db:migrate
          bun test tests/db
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review_tests
          MARKETING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review_tests
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/marketing_review_tests
          # Fresh database is created by the guarded harness to exercise pre-existing profiles before 0023.
          PROFILE_ADMISSION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15439/kids_journey_auth_admission_ci

      - name: Typecheck (todos os pacotes)
        run: bun run --filter '*' typecheck

      - name: Evidências do Pensa integrado
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pensa-native-failure
          path: packages/pensa/.cache/playwright-native-results
          if-no-files-found: ignore

  studio-storage-macos:
    name: studio-storage-macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile
      - name: Preparar navegadores da prova de persistência
        working-directory: packages/studio
        run: bunx playwright install chromium webkit
      - name: Provar recarga imediata e conflito entre abas no macOS
        working-directory: packages/studio
        run: bun test src/state/projectStorageBrowser.test.ts

  desktop-windows:
    name: desktop-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Usar o diretório temporário dedicado do runner
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile
      - name: Verificar compilação do helper nativo de processos
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packages/agent-runtime/src/process/windows-job.ps1 -OutputFile "$env:RUNNER_TEMP/sistemazero-job-proof.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar Chromium para os testes nativos
        timeout-minutes: 5
        working-directory: packages/agent-runtime
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '45000'
        run: |
          node ../agent-integrations/node_modules/playwright-core/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar runtime nativo
        working-directory: packages/agent-runtime
        run: bun test
      - name: Testar desktop e mídia empacotada
        working-directory: packages/marketing-desktop
        run: bun test

  community-kids-e2e:
    name: community-kids-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Preparar fontes Ubuntu assinadas antes das instalações
        run: sudo "$(command -v bun)" --no-env-file scripts/ci/configure-ubuntu-apt.mjs

      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Instalar Chromium do Playwright
        working-directory: packages/community-kids
        run: bunx playwright install --with-deps chromium

      - name: Smoke E2E do Community Kids
        working-directory: packages/community-kids
        run: bun run e2e:smoke

      - name: Planejamento funcional do Pensa em navegador
        working-directory: packages/pensa
        run: bun run e2e

      - name: Experiências ampliadas e responsivas
        working-directory: packages/community-kids
        run: bun run e2e:scenes

      - name: Aula responsiva e objetivos do Estúdio
        working-directory: packages/community-kids
        run: bun run e2e:lesson-layout

      - name: Publicar diagnóstico Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: community-kids-playwright
          path: |
            packages/community-kids/.cache/playwright-results
            packages/community-kids/.cache/scene-results
            packages/community-kids/.cache/lesson-layout-results
            packages/pensa/.cache/playwright-results
          retention-days: 7

  studio-e2e-chromium:
    name: studio-e2e-chromium-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Preparar fontes Ubuntu assinadas antes das instalações
        run: sudo "$(command -v bun)" --no-env-file scripts/ci/configure-ubuntu-apt.mjs

      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Instalar Chromium do Playwright
        working-directory: packages/studio
        run: bunx playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar o compilador confiável para os jogos Pro
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/studio-runtime/runtime

      - name: E2E Chromium completo (shard ${{ matrix.shard }}/3)
        working-directory: packages/studio
        run: bunx playwright test --project=chromium --shard=${{ matrix.shard }}/3

      - name: Publicar diagnóstico Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-playwright-chromium-${{ matrix.shard }}
          path: packages/studio/.cache/playwright-results
          retention-days: 7

  studio-e2e-firefox:
    name: studio-e2e-firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Preparar fontes Ubuntu assinadas antes das instalações
        run: sudo "$(command -v bun)" --no-env-file scripts/ci/configure-ubuntu-apt.mjs

      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Instalar Firefox do Playwright
        working-directory: packages/studio
        run: bunx playwright install --with-deps firefox

      - name: E2E de segurança no Firefox
        working-directory: packages/studio
        run: bunx playwright test --project=firefox

      - name: Publicar diagnóstico Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-playwright-firefox
          path: packages/studio/.cache/playwright-results
          retention-days: 7

  # O WebKit é o motor do iPad, onde a gravação de saída era a mais frágil (antes do
  # commit explícito de 11/09/2026, 0 de 10 recargas guardavam a mudança). Roda só os
  # specs dessa gravação (`testMatch` do projeto `webkit` no playwright.config.ts).
  studio-e2e-webkit:
    name: studio-e2e-webkit
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Instalar WebKit do Playwright
        working-directory: packages/studio
        run: bunx playwright install --with-deps webkit

      - name: E2E da gravação de saída no WebKit
        working-directory: packages/studio
        run: bunx playwright test --project=webkit

      - name: Publicar diagnóstico Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-playwright-webkit
          path: packages/studio/.cache/playwright-results
          retention-days: 7

  members-image:
    name: members-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Construir a imagem final do Members
        run: docker build --progress=plain -f packages/members/Dockerfile -t sz-members-qa:closure .

      - name: Verificar dependências, migrador e manutenção sem banco ou rede
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m --memory 1536m --cpus 1 --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$PWD/packages/members/qa,target=/qa,readonly" \
            sz-members-qa:closure timeout 90s bun --no-env-file /qa/image-smoke.mjs

  deploy-staging:
    name: deploy-staging
    needs: [ci, desktop-windows, studio-storage-macos, community-kids-e2e, studio-e2e-chromium, studio-e2e-firefox, studio-e2e-webkit, members-image]
    # Só push na staging (ou dispatch manual) — PR para a main NUNCA deploya.
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Até 140min na onda canônica (60min por backend), 60min para fila/build dos apps
    # em paralelo e margem para preparação/IaC/disparos. Testes mantêm seus limites.
    timeout-minutes: 240
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API: https://backboard.railway.com/graphql/v2
      RAILWAY_PROJECT_ID: 415d5a1c-5f75-432c-8445-b395d0977ce3
      STAGING_ENV_ID: f634cff6-aafb-4804-8b69-172fad4e946e
      HELPDESK_SERVICE_ID: ${{ vars.RAILWAY_HELPDESK_SERVICE_ID }}
      HELPDESK_APP_SERVICE_ID: ${{ vars.RAILWAY_HELPDESK_APP_SERVICE_ID }}
      LIVE_RECORDER_SERVICE_ID: ${{ vars.RAILWAY_LIVE_RECORDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # ancestralidade e diff desde a última onda bem-sucedida

      - name: Resolver baseline verificado antes de acessar provedores
        id: staging-baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/staging-deploy-baseline.mjs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Instalar dependências do gate de infraestrutura
        run: bun install --frozen-lockfile

      # O Admin usa proxy e não enxerga a falta de CORS que derruba o fetch do Rive no Kids.
      # O objeto-prova permanente é instalado pela CLI com as envs do Admin. O deploy faz
      # somente o mesmo GET público que o navegador da criança, sem depender de credenciais
      # do Railway/R2 e sem misturar manutenção de infraestrutura com entrega de código.
      - name: Provar CORS do R2 público
        working-directory: packages/admin
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: bun run r2:cors:public:check

      - uses: ./.github/actions/setup-railway

      - name: Provar SSH readonly antes de qualquer apply/deploy
        env:
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
          RAILWAY_SSH_KNOWN_HOSTS: ${{ secrets.RAILWAY_SSH_KNOWN_HOSTS }}
        run: node scripts/ci/kids-journey-rollout.mjs preflight "$GITHUB_SHA"

      - name: Aplicar configuração de staging antes dos deployments
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          node scripts/ci/railway-config.mjs plan staging "$RUNNER_TEMP/railway-staging-plan.json"
          node scripts/ci/kids-journey-rollout.mjs check-plan "$RUNNER_TEMP/railway-staging-plan.json"
          node scripts/ci/railway-config.mjs apply staging "$RUNNER_TEMP/railway-staging-plan.json"

      - name: Calcular serviços afetados e deployar
        if: ${{ success() && steps.staging-baseline.outcome == 'success' && steps.staging-baseline.outputs.selector != '' }}
        env:
          BEFORE: ${{ steps.staging-baseline.outputs.before }}
          FORCED: ${{ github.event.inputs.services }}
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
          RAILWAY_SSH_KNOWN_HOSTS: ${{ secrets.RAILWAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # ids dos serviços no Railway (não são segredo)
          declare -A SVC_ID=(
            [api-gateway]=2b7748bc-d3e3-4aff-bd94-3f514b53c44f
            [auth]=8c57d71d-3a8e-48f1-9627-63f1528b9a48
            [catalog]=0e59f903-6bd8-4c3e-8792-34ea7479c13c
            [payments]=1d2455ac-05cd-436b-a39d-3f07392713f3
            [members]=aa282801-ffba-477c-af6d-394b2f4f9af9
            [messaging]=93fb9f5c-3d08-43da-a3cb-4c0207bd2ee0
            [funnel]=a617f2d2-6a58-46a2-8669-2eaf192712f0
            [admin]=e00eca0b-5323-4424-9b58-fdb073cfce82
            [community]=9df1b493-4cea-4b36-bec8-7299f054c17d
            [community-kids]=fc8a1b29-ac14-4dc9-a7b3-03d497b8bf4f
            [hub]=00b27b18-0587-460b-ba90-b6b24c423e45
            [fiscal]=2ea11afd-bdfd-4736-b400-c3db13fd8a0e
            [marketing]=7b8a87e6-a92f-4a5c-adc1-c4d2fe23b737
            [marketing-app]=95f3752d-95f7-45ab-a52a-19aa126d77ab
            [referrals]=1ad1c5ce-977c-4d7d-95a4-b8b08f2dc258
          )
          # Os IDs só existem após o provisionamento externo. Variáveis de
          # repositório permitem ativar o deploy sem editar este workflow.
          [ -n "${HELPDESK_SERVICE_ID:-}" ] && SVC_ID[helpdesk]="$HELPDESK_SERVICE_ID"
          [ -n "${HELPDESK_APP_SERVICE_ID:-}" ] && SVC_ID[helpdesk-app]="$HELPDESK_APP_SERVICE_ID"
          [ -n "${LIVE_RECORDER_SERVICE_ID:-}" ] && SVC_ID[live-recorder]="$LIVE_RECORDER_SERVICE_ID"

          declare -A WANT=()
          add() { WANT[$1]=1; }
          add_all() { for s in "${!SVC_ID[@]}"; do add "$s"; done; }
          add_helpdesk() {
            [ -n "${SVC_ID[helpdesk]:-}" ] || {
              echo "::error::Configure RAILWAY_HELPDESK_SERVICE_ID antes de deployar packages/helpdesk"; exit 1;
            }
            add helpdesk
          }
          add_helpdesk_app() {
            [ -n "${SVC_ID[helpdesk-app]:-}" ] || {
              echo "::error::Configure RAILWAY_HELPDESK_APP_SERVICE_ID antes de deployar packages/helpdesk-app"; exit 1;
            }
            add helpdesk-app
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${FORCED:-all}" != 'auto' ]; then
            if [ "${FORCED:-all}" = "all" ]; then add_all; else
              IFS=',' read -ra REQ <<< "$FORCED"
              for s in "${REQ[@]}"; do
                s="$(echo "$s" | xargs)"
                [ -n "${SVC_ID[$s]:-}" ] && add "$s" || { echo "serviço desconhecido: $s"; exit 1; }
              done
            fi
          else
            if [ "${FORCED:-}" = 'auto' ]; then
              if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA"; then
                echo '::error::before_sha deve ser um commit ancestral de staging; nenhum deploy foi disparado'; exit 1
              fi
            fi
            # range do push; branch nova/força → deploya tudo (não dá pra saber o diff)
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "range indisponível — deployando tudo"
              add_all
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
              echo "arquivos alterados:"; echo "$CHANGED"
              # Espelha os watchPatterns em .railway/services.
              while IFS= read -r f; do
                case "$f" in
                  bun.lock|package.json|.dockerignore) add_all ;;
                  .railway/*) add_all ;;
                  scripts/release/*) add members; add hub; add admin; add community; add community-kids ;;
                  # core é lib COMPARTILHADA: além dos serviços, os 3 apps Next o EMPACOTAM
                  # (admin/community via member-shell+studio; kids direto) — sem eles aqui, o
                  # front servia um core VELHO até alguém deployar na mão.
                  packages/core/*) for s in api-gateway auth catalog payments members messaging funnel fiscal hub marketing referrals admin community community-kids marketing-app; do add "$s"; done; [ -n "${SVC_ID[helpdesk]:-}" ] && add helpdesk; [ -n "${SVC_ID[helpdesk-app]:-}" ] && add helpdesk-app ;;
                  packages/ui/*) add admin; add community; add community-kids; add funnel; add marketing-app; [ -n "${SVC_ID[helpdesk-app]:-}" ] && add helpdesk-app ;;
                  packages/api-gateway/*) add api-gateway ;;
                  packages/auth/*) add auth ;;
                  packages/catalog/*) add catalog ;;
                  packages/payments/*) add payments ;;
                  packages/members/*) add members ;;
                  packages/live-recorder/*)
                    [ -n "${SVC_ID[live-recorder]:-}" ] || { echo '::error::Configure RAILWAY_LIVE_RECORDER_SERVICE_ID'; exit 1; }
                    add live-recorder ;;
                  packages/messaging/*) add messaging ;;
                  packages/funnel/*) add funnel ;;
                  packages/admin/*) add admin ;;
                  packages/community/*) add community ;;
                  packages/member-shell/*) add community; add community-kids; add admin ;; # BFF dos 2 apps de aluno + o admin (studio-embed/entregas dependem dele)
                  packages/community-kids/*) add community-kids ;;
                  packages/hub/*) add hub ;; # backend da comunidade (Clube/Mural) — serviço próprio
                  packages/fiscal/*) add fiscal ;;
                  packages/marketing/*) add marketing ;; # ferramenta de marketing (API)
                  packages/marketing-app/*) add marketing-app ;; # front da ferramenta de marketing
                  packages/referrals/*) add referrals ;; # indicações e bolsas (API)
                  packages/helpdesk/*) add_helpdesk ;;
                  packages/helpdesk-app/*) add_helpdesk_app ;;
                  # Contrato PURO compartilhado: backend + console + member-shell (BFF dos 2 apps de aluno e o admin).
                  packages/helpdesk-contracts/*) add_helpdesk; add_helpdesk_app; add community; add community-kids; add admin ;;
                  # lib embarcada: 2 apps de aluno (editor/player) + admin (studio-embed de autoria/entregas,
                  # transpilePackages). E o Members: ele confere as atividades das aulas no servidor com o
                  # catálogo de blocos e o avaliador do Estúdio (`@sistemazero/studio/server-project-checks`);
                  # sem ele aqui, um bloco novo era aceito na autoria (admin) e recusado na correção.
                  packages/studio/*) add community; add community-kids; add admin; add members ;;
                  packages/pensa/*) add community-kids; add community ;; # planejamento compartilhado pelos dois públicos
                  # Bloco de aula do Pinta: o renderizador de blocos é COMPARTILHADO (o adulto
                  # compila o pacote mesmo sem usar o bloco) e o admin embute o editor na autoria
                  # e no viewer da entrega; o Members valida o mesmo wire no servidor — todos
                  # precisam acompanhar o pacote para não servir contratos de versões diferentes.
                  packages/pinta/*) add community-kids; add community; add admin; add members ;;
                  packages/molda/*) add community-kids; add community ;; # oficina 3D compartilhada pelos dois públicos
                esac
              done <<< "$CHANGED"
            fi
          fi

          if [ "${#WANT[@]}" -eq 0 ]; then
            echo "nenhum serviço afetado por este push — nada a deployar ✅"
            exit 0
          fi
          echo "deployando no staging: ${!WANT[*]} (sha $GITHUB_SHA)"

          gql() { curl -sS --connect-timeout 5 --max-time "${2:-15}" -X POST -H "Authorization: Bearer $RAILWAY_TOKEN" -H 'content-type: application/json' -d "$1" "$RAILWAY_API"; }

          declare -A DEP=()
          disparar() {
            local s="$1"
            BODY=$(jq -nc --arg sid "${SVC_ID[$s]}" --arg eid "$STAGING_ENV_ID" --arg sha "$GITHUB_SHA" \
              '{query:"mutation($s:String!,$e:String!,$c:String){serviceInstanceDeployV2(serviceId:$s,environmentId:$e,commitSha:$c)}",variables:{s:$sid,e:$eid,c:$sha}}')
            RESP=$(gql "$BODY")
            ID=$(echo "$RESP" | jq -r '.data.serviceInstanceDeployV2 // empty')
            if [ -z "$ID" ]; then echo "::error::deploy de $s falhou ao disparar: $(echo "$RESP" | jq -c '.errors // .')"; exit 1; fi
            DEP[$s]="$ID"
            echo "  $s → deployment $ID"
          }

          # Uma consulta readonly por round para toda a onda, com backoff da API.
          # Os IDs vêm somente dos ACKs; o monitor nunca dispara/repete deployments.
          esperar() {
            local entries='[]' s
            for s in "$@"; do
              entries=$(jq -c --arg service "$s" --arg id "${DEP[$s]}" --arg serviceId "${SVC_ID[$s]}" \
                '. + [{service:$service,id:$id,serviceId:$serviceId}]' <<< "$entries")
            done
            RAILWAY_DEPLOYMENTS="$entries" node scripts/ci/staging-deploy-monitor.mjs "$GITHUB_SHA"
          }

          # O wrapper é a barreira canônica: migrations/V0 -> Auth novo e antigos
          # REMOVED -> captura/baseline/V1. /readyz sozinho não libera os apps.
          # Erro/cancelamento preserva dados e exige retomada explícita, sem fallback.
          if [ -n "${WANT[members]:-}" ] || [ -n "${WANT[auth]:-}" ]; then
            node scripts/ci/kids-journey-rollout.mjs deploy "$GITHUB_SHA"
            unset 'WANT[members]' 'WANT[auth]'
          elif [ -n "${WANT[community-kids]:-}" ] || [ -n "${WANT[community]:-}" ] || [ -n "${WANT[admin]:-}" ]; then
            node scripts/ci/kids-journey-rollout.mjs verify "$GITHUB_SHA"
          fi
          for s in "${!WANT[@]}"; do disparar "$s"; done
          if [ "${#DEP[@]}" -eq 0 ]; then echo "onda canônica concluída; nenhum outro serviço solicitado"; exit 0; fi

          esperar "${!DEP[@]}"
          echo "staging atualizado ✅"
