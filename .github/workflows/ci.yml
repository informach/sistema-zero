name: Read-only all staging deployment status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect statuses only
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          HELPDESK_SERVICE_ID: ${{ vars.HELPDESK_SERVICE_ID }}
          HELPDESK_APP_SERVICE_ID: ${{ vars.HELPDESK_APP_SERVICE_ID }}
          LIVE_RECORDER_SERVICE_ID: ${{ vars.LIVE_RECORDER_SERVICE_ID }}
        run: node scripts/ci/molda-all-staging-readonly.mjs
